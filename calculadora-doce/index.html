<div><h1>Doce Preço</h1><p>Precificação para bolos e doces.</p></div></div><span class="local">Sua confeitaria, nos seus números.</span></header>

// Package prices are illustrative fixtures, not current market quotes.
const CATALOG=[
['farinha','Farinha de trigo','Massas','g',1000,6],['acucar','Açúcar refinado','Massas','g',1000,5],['confeiteiro','Açúcar de confeiteiro','Massas','g',500,9],['mascavo','Açúcar mascavo','Massas','g',500,9],['demerara','Açúcar demerara','Massas','g',1000,9],['ovos','Ovos','Massas','un',12,12],['manteiga','Manteiga sem sal','Massas','g',200,12],['margarina','Margarina culinária','Massas','g',500,9],['fermento','Fermento químico','Massas','g',100,5],['bicarbonato','Bicarbonato de sódio','Massas','g',100,5],['amido','Amido de milho','Massas','g',500,8],['oleo','Óleo vegetal','Massas','ml',900,8],['sal','Sal refinado','Massas','g',1000,3],['leite','Leite integral','Massas','ml',1000,5],

['chocolatepo','Chocolate em pó 50%','Chocolates','g',200,12],['cacau','Cacau em pó 100%','Chocolates','g',200,18],['chocleite','Chocolate nobre ao leite','Chocolates','g',1000,45],['chocamargo','Chocolate nobre meio amargo','Chocolates','g',1000,48],['chocbranco','Chocolate nobre branco','Chocolates','g',1000,50],['fracionado','Cobertura fracionada','Chocolates','g',1000,28],['gotas','Gotas de chocolate','Chocolates','g',500,22],

].map(([id,name,category,unit,pack,price])=>({id,name,category,unit,pack,price}));
const UNITS=['g','kg','ml','L','un'],KINDS=['Massa','Recheio','Cobertura','Outro'];
const defaultBusiness={fixed:600,hours:100,hourly:20,margin:30,tax:0};
const fresh=()=>({type:'produto',name:'',mode:'un',yield:1,yieldUnit:'g',kind:'Massa',minutes:60,packaging:0,extra:0,current:'',items:[],source:null});
const stored=read();
let business={...defaultBusiness,...stored.business},recipe=stored.recipe&&Array.isArray(stored.recipe.items)?{...fresh(),...stored.recipe}:fresh();
let saved=Array.isArray(stored.saved)?stored.saved:[],custom=Array.isArray(stored.custom)?stored.custom:[];
// Despensa: one price per ingredient. `prices` overrides the catalog examples; custom ingredients keep their own price.
let prices=stored.prices&&typeof stored.prices==='object'?stored.prices:{},bases=Array.isArray(stored.bases)?stored.bases:[];
let step=stored.recipe?2:1,category='Todos',query='',editing=null,pantryEditing=null;let libraryOpen=false,examplesOpen=false,savedOpen=false,basesOpen=false,pantryOpen=false;
const modes={un:{label:'Unidade',per:'unidade',yield:'Unidades produzidas',factor:1},fatia:{label:'Fatia',per:'fatia',yield:'Fatias produzidas',factor:1},bolo:{label:'Bolo inteiro',per:'bolo inteiro',yield:'Bolos produzidos',factor:1},cento:{label:'Cento',per:'cento',yield:'Docinhos produzidos (unidades)',factor:100},kg:{label:'Quilo',per:'kg',yield:'Peso final produzido (kg)',factor:1}};
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:2,business,recipe,saved,custom,prices,bases}));return true}catch{return false}}
function baseUnit(u){return u==='kg'?'g':u==='L'?'ml':u}
function quantity(q,u){return num(q)*(u==='kg'||u==='L'?1000:1)}
function per(u){const b=baseUnit(u);return b==='g'?['kg',1000]:b==='ml'?['L',1000]:['un',1]}
function catalogItem(id){return CATALOG.find(i=>i.id===id)}
function pantryGet(ref){const c=custom.find(c=>c.id===ref);if(c)return {name:c.name,category:'Meus',price:num(c.price),pack:num(c.pack),packUnit:c.packUnit,mine:true};const i=catalogItem(ref);if(!i)return null;const o=prices[ref];return {name:i.name,category:i.category,price:o?num(o.price):i.price,pack:o?num(o.pack):i.pack,packUnit:o?o.packUnit:i.unit,mine:!!o}}
function pantrySet(ref,p){const v={price:num(p.price),pack:num(p.pack),packUnit:p.packUnit},c=custom.find(c=>c.id===ref);if(c)Object.assign(c,v);else prices[ref]=v}
function validPantry(p){return !!p&&UNITS.includes(p.packUnit)&&num(p.price)>=0&&num(p.pack)>0}
function findBase(id){return bases.find(b=>b.id===id)}
// A base holds only ingredients, so its cost never recurses.
function baseCost(b){return b.items.reduce((s,i)=>s+itemCost(i),0)}
function baseUnitCost(b){return baseCost(b)/quantity(b.yield,b.yieldUnit)}
function itemCost(i){if(i.base){const b=findBase(i.base);return b?baseUnitCost(b)*quantity(i.used,i.usedUnit):NaN}const p=pantryGet(i.ref);return p?p.price*quantity(i.used,i.usedUnit)/quantity(p.pack,p.packUnit):NaN}

bindInputs({price:'price',pack:'pack',used:'used','custom-name':'name'},editing);if($('#pack-unit'))$('#pack-unit').onchange=()=>{editing.packUnit=$('#pack-unit').value;if(baseUnit(editing.usedUnit)!==baseUnit(editing.packUnit))editing.usedUnit=editing.packUnit;renderEditor()};$('#used-unit').onchange=()=>{editing.usedUnit=$('#used-unit').value};$('#cancel-item').onclick=()=>{editing=null;renderEditor()};
$('#add-item').onclick=()=>{const e=editing,bad=t=>{$('#item-errors').innerHTML=errorBox([t])};let item,changed=false;
if(e.base){item={base:e.base,name:e.name,used:num(e.used),usedUnit:e.usedUnit};if(!validItem(item))return bad('Informe quanto usa, maior que zero.')}
else{const p={price:num(e.price),pack:num(e.pack),packUnit:e.packUnit},name=String(e.name||'').trim();if(!name||!validPantry(p)||!(num(e.used)>0)||baseUnit(p.packUnit)!==baseUnit(e.usedUnit))return bad('Informe o nome, um preço não negativo e quantidades maiores que zero, em unidades compatíveis.');let ref=e.ref;if(!ref){ref='custom-'+Date.now();custom.push({id:ref,name,...p})}else{const old=pantryGet(ref);changed=old.price!==p.price||old.pack!==p.pack||old.packUnit!==p.packUnit;if(changed)pantrySet(ref,p)}item={ref,name,used:num(e.used),usedUnit:e.usedUnit}}
if(e.index!==undefined)recipe.items[e.index]=item;else recipe.items.push(item);const n=changed?usage(item.ref):0;editing=null;libraryOpen=false;step=2;persist();render();$('#ingredients').scrollIntoView({block:'nearest'});notify(n?`Preço atualizado na despensa e em ${n} ${n===1?'receita ou base salva':'receitas e bases salvas'}.`:changed?'Preço guardado na despensa.':'Ingrediente na receita.')}}
function renderBases(){const el=$('#bases');el.innerHTML=bases.length?bases.map(b=>{const [l,f]=per(b.yieldUnit);return `<div class="saved-row"><button class="open" data-base-edit="${esc(b.id)}">${esc(b.name)}<small>${esc(b.kind)} · rende ${esc(fmt(b.yield))} ${esc(b.yieldUnit)} · ${brl(baseUnitCost(b)*f)} por ${l}</small></button>${recipe.type!=='base'?`<button class="secondary small" data-base-use="${esc(b.id)}">Usar</button>`:''}<button class="icon-btn" data-base-del="${esc(b.id)}" aria-label="Excluir ${esc(b.name)}">×</button></div>`}).join(''):'<p class="help">Nenhuma base ainda. Monte sua massa ou recheio padrão uma vez e use em vários bolos.</p>';
document.querySelectorAll('[data-base-edit]').forEach(x=>x.onclick=()=>{const b=findBase(x.dataset.baseEdit);if(recipe.items.length&&recipe.baseId!==b.id&&!confirm('Abrir esta base para editar? O rascunho atual será substituído.'))return;recipe={...fresh(),type:'base',baseId:b.id,name:b.name,kind:b.kind,yield:b.yield,yieldUnit:b.yieldUnit,items:clone(b.items)};editing=null;step=2;persist();render();$('#tabs').scrollIntoView({block:'start'})});
document.querySelectorAll('[data-base-use]').forEach(x=>x.onclick=()=>{const b=findBase(x.dataset.baseUse);step=2;libraryOpen=true;editing={base:b.id,name:b.name,used:'',usedUnit:baseUnit(b.yieldUnit)};render();openEditor()});
document.querySelectorAll('[data-base-del]').forEach(x=>x.onclick=()=>{const id=x.dataset.baseDel,n=usageBase(id);if(n){notify(`Esta base está em ${n} ${n===1?'receita':'receitas'}. Tire ela de lá antes de excluir.`);return}if(!confirm('Excluir esta base?'))return;bases=bases.filter(b=>b.id!==id);persist();render()})}
function pantryRefs(){const s=new Set([...Object.keys(prices),...custom.map(c=>c.id)]),add=items=>(items||[]).forEach(i=>i.ref&&s.add(i.ref));add(recipe.items);saved.forEach(x=>add(x.recipe.items));bases.forEach(b=>add(b.items));return [...s].filter(r=>pantryGet(r)).sort((a,b)=>pantryGet(a).name.localeCompare(pantryGet(b).name,'pt-BR'))}
function renderPantry(){const el=$('#pantry'),refs=pantryRefs();$('#pantry-count').textContent=refs.length;el.innerHTML=refs.length?refs.map(r=>{const p=pantryGet(r),n=usage(r);if(pantryEditing===r)return `<div class="editor" style="margin:10px 0"><h3>${esc(p.name)}</h3><div class="fields"><div class="full">${field('p-price','Quanto pagou? (R$)',p.price)}</div>${field('p-pack','Quanto veio?',p.pack)}${unitSelect('p-unit',p.packUnit)}</div><div id="p-errors"></div><div class="actions"><button class="secondary" id="p-cancel">Cancelar</button><button class="primary" id="p-save">Salvar preço</button></div></div>`;return `<div class="saved-row"><div class="pantry-name">${esc(p.name)}<small>${brl(p.price)} / ${esc(fmt(p.pack))} ${esc(p.packUnit)}${p.mine?'':' · preço de exemplo'} · em ${n} ${n===1?'receita salva':'receitas salvas'}</small></div><button class="secondary small" data-pantry="${esc(r)}">Atualizar</button></div>`}).join(''):'<p class="help">Os ingredientes que você usar aparecem aqui, com o preço que você paga.</p>';
document.querySelectorAll('[data-pantry]').forEach(b=>b.onclick=()=>{pantryEditing=b.dataset.pantry;renderPantry();$('#p-price').focus()});
if(pantryEditing&&$('#p-save')){const r=pantryEditing;$('#p-cancel').onclick=()=>{pantryEditing=null;renderPantry()};$('#p-save').onclick=()=>{const p={price:num($('#p-price').value),pack:num($('#p-pack').value),packUnit:$('#p-unit').value};if(!validPantry(p)){$('#p-errors').innerHTML=errorBox(['Informe um preço maior ou igual a zero e a quantidade da embalagem.']);return}const name=pantryGet(r).name;pantrySet(r,p);pantryEditing=null;pantryOpen=true;persist();render();notify('Preço de '+name+' atualizado em todas as receitas e bases.')}}}
function renderResult(){detachAside();if(recipe.type==='base'){$('#main').innerHTML=`<h2>Isto é uma receita base</h2><p class="sub">Bases não têm preço de venda. Salve a base e use ela dentro de um produto, como um bolo ou um cento de doces.</p><div class="actions"><button class="primary" id="fix-recipe">Voltar para a base</button></div>`;$('#fix-recipe').onclick=()=>{step=2;render()};return}const c=calculate(),m=modes[recipe.mode]||modes.un;if(c.errors.length){$('#main').innerHTML=`<h2>Vamos conferir os dados</h2><p class="sub">Complete estes campos antes de calcular seu preço.</p>${errorBox(c.errors)}<div class="actions"><button class="secondary" id="fix-business">Rever negócio</button><button class="primary" id="fix-recipe">Rever receita</button></div>`;$('#fix-business').onclick=()=>{step=1;render()};$('#fix-recipe').onclick=()=>{step=2;render()};return}const row=(label,value,cl='')=>`<div class="${cl}"><dt>${label}</dt><dd>${brl(value)}</dd></div>`;$('#main').innerHTML=`<h2>Seu preço</h2><p class="sub">${esc(recipe.name)} · ${fmt(recipe.yield)} ${unitWord()}</p><div class="result-head"><p>Preço sugerido por ${m.per}</p><strong id="suggested">${brl(c.rounded)}</strong><small>Inclui ${fmt(business.margin)}% de margem e ${fmt(business.tax)}% de taxas.</small></div><h3>Custo por ${m.per}</h3><dl class="breakdown">${row('Ingredientes e bases',c.ingredients/c.sales)}${row('Embalagem',num(recipe.packaging))}${row('Seu trabalho',c.labor/c.sales)}${row('Despesas fixas rateadas',c.overhead/c.sales)}${row('Outros custos',c.extra/c.sales)}${row('Custo total',c.cost,'total')}</dl><div class="info">Mínimo sem lucro: <strong>${brl(c.minimum)}</strong> por ${m.per}.<br>Vendendo tudo (${fmt(recipe.yield)} ${unitWord()}): <strong>${brl(c.rounded*c.sales)}</strong>.<br>Custo do lote completo: <strong>${brl(c.batch)}</strong>.<br>Lucro por ${m.per} ao preço sugerido: <strong>${brl(c.rounded*(1-c.tax)-c.cost)}</strong>.</div>${recipe.mode==='cento'?'<p class="help">Preço para 100 doces, calculado proporcionalmente ao rendimento do lote. A embalagem também é por cento.</p>':''}<details class="source"><summary>Como o cálculo é feito</summary><p>Ingrediente = preço da embalagem × quantidade usada ÷ quantidade comprada, com conversão entre g/kg e ml/L. Base = custo dos ingredientes dela ÷ rendimento pronto × quanto você usa.</p><p>Preço = custo por venda ÷ (1 − margem − taxas). O preço sugerido é arredondado para cima ao centavo. A margem é sobre a venda, não um acréscimo sobre o custo.</p><p>O custo do lote inclui ingredientes, bases, tempo × valor da hora, rateio das despesas fixas, outros custos e embalagens. O rateio por hora é ${brl(num(business.fixed)/num(business.hours))}.</p></details><div class="section no-print">${field('current','Quanto você cobra por '+m.per+' hoje? (R$)',recipe.current,'Opcional. Compare com seu custo e sua margem.')}<div id="diagnosis" aria-live="polite"></div></div><div class="actions"><button class="secondary" id="back-recipe">Editar</button><button class="primary" id="save">${recipe.savedId&&saved.some(s=>s.id===recipe.savedId)?'Salvar alterações':'Salvar receita'}</button></div><button class="link no-print" id="print">Imprimir resumo</button>${sourceInfo()}`;$('#current').oninput=()=>{recipe.current=$('#current').value;persist();diagnose(c)};$('#back-recipe').onclick=()=>{step=2;render()};
$('#save').onclick=()=>{const k0=saved.findIndex(s=>s.id===recipe.savedId),id=k0>=0?recipe.savedId:Date.now();recipe.savedId=id;const entry={id,date:new Date().toLocaleDateString('pt-BR'),recipe:clone(recipe),business:clone(business)};if(k0>=0)saved[k0]=entry;else saved.unshift(entry);const ok=persist();renderAside();$('#save').textContent='Salvar alterações';notify(ok?(k0>=0?'Receita atualizada.':'Receita salva neste navegador.'):'Não foi possível salvar no navegador. Imprima o resumo para guardar.')};$('#print').onclick=()=>window.print();diagnose(c)}
function diagnose(c){const target=$('#diagnosis');if(recipe.current===''){target.innerHTML='';return}const p=num(recipe.current);if(!Number.isFinite(p)||p<0){target.innerHTML=errorBox(['Informe um preço válido, maior ou igual a zero.']);return}const profit=p*(1-c.tax)-c.cost,margin=p>0?profit/p*100:0;target.innerHTML=`<div class="${profit<0?'error':'info'}">${profit<0?'Prejuízo de '+brl(-profit):'Lucro de '+brl(profit)} por ${modes[recipe.mode].per}, após as taxas.${p>0?' Margem real: '+fmt(margin)+'%.':''} ${margin+1e-8<num(business.margin)?'Abaixo da margem desejada.':''}</div>`}
function renderSaved(){const summary=$('#saved-panel>summary');if(summary)summary.textContent='Minhas receitas salvas ('+saved.length+')';$('#saved').innerHTML=saved.length?saved.map(s=>`<div class="saved-row"><button class="open" data-open="${s.id}">${esc(s.recipe.name)}<small>${esc(s.date)} · abrir receita e configurações salvas</small></button><button class="icon-btn" data-delete="${s.id}" aria-label="Excluir ${esc(s.recipe.name)}">×</button></div>`).join(''):'<p class="help">Salve uma receita na etapa Preço para encontrá-la aqui. Sem limite de receitas.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const s=saved.find(s=>String(s.id)===b.dataset.open);if(recipe.items.length&&recipe.savedId!==s.id&&!confirm('Abrir a receita salva e suas configurações? O rascunho atual será substituído.'))return;recipe={...fresh(),...clone(s.recipe),savedId:s.id};business=clone(s.business);step=2;editing=null;persist();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Excluir esta receita salva?'))return;saved=saved.filter(s=>String(s.id)!==b.dataset.delete);persist();renderAside()})}
function fixture(id,used,name){const i=catalogItem(id);return {ref:id,name:name||i.name,used,usedUnit:i.unit}}
function example(kind){const r=fresh();if(kind==='cake'){Object.assign(r,{name:'Bolo de chocolate recheado com brigadeiro',mode:'fatia',yield:20,minutes:85,packaging:1.2,extra:0,items:[fixture('ovos',5),fixture('acucar',180),fixture('leite',240),fixture('farinha',240),fixture('chocolatepo',100),fixture('fermento',12),fixture('condensado',790),fixture('manteiga',30),fixture('granulado',80),fixture('manteiga',5,'Manteiga para untar (estimativa)'),fixture('farinha',10,'Farinha para polvilhar (estimativa)')],source:{title:'Bolo de Chocolate com Recheio de Brigadeiro',url:'https://www.receitasnestle.com.br/receitas/bolo-de-chocolate-com-brigadeiro',note:'20 porções na fonte. Conversões adotadas para o teste: açúcar 180 g/xícara; farinha 120 g/xícara; leite 240 ml/xícara; chocolate em pó 100 g/xícara (massa + recheio); fermento 12 g/colher; manteiga 15 g/colher; granulado 160 g/xícara. Acrescentados 5 g de manteiga e 10 g de farinha para untar. Os 85 min publicados foram usados como hipótese de ocupação produtiva; ajuste ao tempo real.'}})}else{Object.assign(r,{name:'Brigadeiro tradicional',mode:'un',yield:30,minutes:40,packaging:.1,extra:0,items:[fixture('condensado',340),fixture('chocolatepo',30),fixture('manteiga',15),fixture('granulado',160),fixture('manteiga',5,'Manteiga para untar (estimativa)')],source:{title:'Brigadeiro de Leite Moça',url:'https://www.receitasnestle.com.br/receitas/receita-brigadeiro-moca',note:'30 porções na fonte consultada, que usa 340 g de leite condensado; aqui custeado pelo preço da embalagem na sua despensa. Conversões de teste: chocolate em pó 10 g/colher; manteiga 15 g/colher; granulado 160 g/xícara, custeado integralmente. Acrescentados 5 g de manteiga para untar. Tempo ativo de 40 min estimado para cozinhar, enrolar e embalar. O rendimento real depende do tamanho dos doces.'}})}return r}
function loadExample(kind){if(recipe.items.length&&!confirm('Carregar o exemplo? A receita atual e os dados do negócio serão substituídos por valores de demonstração.'))return;examplesOpen=false;libraryOpen=false;recipe=example(kind);business=clone(defaultBusiness);editing=null;step=2;persist();render();notify('Exemplo carregado com custos simulados. Ajuste às suas compras.');$('#tabs').scrollIntoView({block:'start'})}
