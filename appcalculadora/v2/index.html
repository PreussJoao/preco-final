<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preço Certo — calculadora de marmita</title>
<meta name="description" content="Descubra em 1 minuto quanto cobrar por cada marmita. Sem login, sem planilha.">
<meta name="theme-color" content="#2A211B">
<meta name="robots" content="noindex">
<!-- V2 (teste): não substitui a versão no ar. Usa as mesmas chaves de localStorage, compatível nos dois sentidos. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&display=swap" rel="stylesheet">
<style>
.pc-app {
  /* paleta idêntica à da landing page do Preço Certo */
  --cream: #FBF6EE;
  --paper: #FFFFFF;
  --ink: #2A211B;
  --ink-2: #1A1410;
  --ink-soft: #5F5247;
  --brand: #C1502E;
  --brand-dark: #9F3D1F;
  --brand-soft: #FBEDE6;
  --accent: #3E6B4F;
  --accent-soft: #EAF1EB;
  --gold: #C98A16;
  --gold-lit: #F2B24C;
  --gold-soft: #FBF0DC;
  --danger: #9A2B1A;
  --danger-soft: #F9E9E4;
  --line: #E8DCCB;
  --muted: #5F5247;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Bitter", Georgia, "Times New Roman", serif;
  --shadow: 0 2px 4px rgba(42,33,27,0.06), 0 8px 24px rgba(42,33,27,0.08);
  font-family: var(--sans);
  background: var(--cream);
  min-height: 100%;
  padding: 24px 12px;
  color: var(--ink);
  box-sizing: border-box;
}
html, body { margin: 0; padding: 0; background: #FBF6EE; color-scheme: light; }
.pc-app * { box-sizing: border-box; }
.pc-app svg { display: block; }

.pc-shell {
  max-width: 440px;
  margin: 0 auto;
  background: var(--paper);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.pc-header {
  background: linear-gradient(165deg, var(--ink), var(--ink-2));
  padding: 22px 22px 0;
}
.pc-header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.pc-header-badge {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 11px;
  background: var(--brand); display: flex; align-items: center; justify-content: center; color: #FFFFFF;
}
.pc-header-text h1 {
  font-family: var(--serif); font-weight: 700; font-size: 1.3rem; color: #FFFFFF;
  margin: 0; line-height: 1.15; letter-spacing: -0.01em;
}
.pc-header-text p { font-size: 0.78rem; color: rgba(246,239,230,0.72); margin: 3px 0 0; font-weight: 500; }
.pc-tabs { display: flex; gap: 2px; }
.pc-tab {
  flex: 1; text-align: center; padding: 10px 4px 12px; font-size: 0.74rem; font-weight: 600;
  letter-spacing: 0.01em; color: rgba(246,239,230,0.5);
  border-bottom: 2.5px solid rgba(255,255,255,0.12);
  transition: color 0.15s ease, border-color 0.15s ease; cursor: pointer;
  background: none; border-left: 0; border-right: 0; border-top: 0; font-family: var(--sans);
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.pc-tab .num {
  display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
  border-radius: 50%; background: rgba(255,255,255,0.14); font-size: 0.65rem; flex: 0 0 auto;
}
.pc-tab.active { color: #FFFFFF; border-bottom-color: var(--brand); }
.pc-tab.active .num { background: var(--brand); }
.pc-tab.done { color: rgba(246,239,230,0.8); }
.pc-tab.done .num { background: rgba(255,255,255,0.22); }

.pc-body { padding: 22px 20px 24px; }
.pc-step-title {
  font-family: var(--serif); font-weight: 700; font-size: 1.3rem; color: var(--ink);
  margin: 0 0 4px; letter-spacing: -0.01em;
}
.pc-step-sub { font-size: 0.85rem; color: var(--muted); margin: 0 0 20px; line-height: 1.45; }
.pc-field { margin-bottom: 16px; }
.pc-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.pc-help { font-size: 0.76rem; color: var(--muted); margin-top: 5px; line-height: 1.4; }
.pc-input-wrap { position: relative; }
.pc-prefix {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  font-size: 0.9rem; font-weight: 600; color: rgba(42,33,27,0.4); pointer-events: none;
}
.pc-input {
  width: 100%; padding: 12px 13px; border-radius: 10px; border: 1.5px solid var(--line);
  font-family: var(--sans); font-size: 1rem; font-variant-numeric: tabular-nums;
  background: #fff; color: var(--ink); transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.pc-input.has-prefix { padding-left: 38px; }
.pc-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(193,80,46,0.12); }
.pc-input.text { font-variant-numeric: normal; }
.pc-input::placeholder { color: rgba(42,33,27,0.38); }
.pc-suffix {
  position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
  font-size: 0.85rem; font-weight: 600; color: rgba(42,33,27,0.45);
}
.pc-advanced-toggle {
  display: inline-flex; align-items: center; gap: 5px; font-size: 0.82rem; color: var(--brand);
  font-weight: 700; cursor: pointer; margin: 2px 0 14px; user-select: none;
  background: none; border: none; font-family: var(--sans); padding: 0;
}
.pc-advanced-toggle svg { transition: transform 0.2s ease; }
.pc-advanced-toggle.open svg { transform: rotate(180deg); }
.pc-advanced-box { background: var(--cream); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 2px; margin-bottom: 16px; }
.pc-link-btn {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
  color: var(--brand); font-family: var(--sans); font-size: 0.85rem; font-weight: 700;
  cursor: pointer; padding: 10px 2px; margin-top: 2px;
}
.pc-link-btn:hover { text-decoration: underline; }
.pc-row2 { display: flex; gap: 12px; flex-wrap: wrap; }
.pc-row2 > div { flex: 1 1 130px; }
.pc-info-box {
  border: 1px solid #CBDDD0; background: var(--accent-soft); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 16px; font-size: 0.85rem; color: #2E4A38; line-height: 1.45;
}
.pc-info-box strong { color: var(--accent); font-variant-numeric: tabular-nums; }
.pc-info-box:empty { display: none; }

.pc-btn {
  padding: 14px 18px; border-radius: 11px; font-family: var(--sans); font-weight: 700;
  font-size: 0.95rem; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.08s ease;
}
/* mesmo botão "com base" da landing page */
.pc-btn-primary {
  background: var(--brand); color: #FFFFFF; flex: 1;
  box-shadow: 0 3px 0 var(--brand-dark), 0 8px 16px rgba(193,80,46,0.2);
}
.pc-btn-primary:hover { background: #CB5731; }
.pc-btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--brand-dark); }
.pc-btn-primary:disabled { background: #E0D5C6; color: rgba(42,33,27,0.4); box-shadow: none; cursor: not-allowed; transform: none; }
.pc-btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); flex: 0 0 50px; padding: 0; }
.pc-btn-ghost:hover { background: var(--cream); }
.pc-btn-ghost:active { transform: scale(0.98); }
.pc-btn-row { display: flex; gap: 10px; margin-top: 22px; }

.pc-section-label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700;
  color: var(--brand); margin: 22px 0 8px;
}
.pc-search-wrap { position: relative; }
.pc-search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: rgba(42,33,27,0.38); }
.pc-search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff;
  border: 1px solid var(--line); border-radius: 11px;
  box-shadow: 0 12px 28px -10px rgba(42,33,27,0.3); max-height: 240px; overflow-y: auto; z-index: 20;
}
.pc-search-results:empty { display: none; }
.pc-search-item {
  padding: 11px 14px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; border-bottom: 1px solid var(--line); font-size: 0.88rem; gap: 10px;
  width: 100%; background: #fff; border-left: 0; border-right: 0; border-top: 0;
  font-family: var(--sans); text-align: left; color: var(--ink);
}
.pc-search-item:last-child { border-bottom: none; }
.pc-search-item:hover { background: var(--brand-soft); }
.pc-search-item .name { font-weight: 600; }
.pc-tag {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
  color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 7px; white-space: nowrap;
}

.pc-selected-box { margin-top: 10px; padding: 15px; background: var(--cream); border: 1px solid var(--line); border-radius: 13px; }
.pc-selected-box .name { font-family: var(--serif); font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
.pc-subsection-label {
  display: flex; align-items: center; gap: 6px; font-size: 0.73rem; font-weight: 700;
  color: var(--brand); text-transform: uppercase; letter-spacing: 0.04em; margin: 15px 0 7px;
}
.pc-buy-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-input-wrap.buy { flex: 1 1 100px; min-width: 90px; }
.pc-input.buy { padding: 10px 10px 10px 32px; font-size: 0.9rem; }
.pc-input-wrap.buy .pc-prefix { left: 10px; font-size: 0.8rem; }
.pc-buy-sep { font-size: 0.82rem; color: var(--muted); flex: 0 0 auto; }
.pc-input.buy.qty { flex: 1 1 64px; min-width: 56px; padding: 10px; font-size: 0.9rem; }
.pc-unit-plain { font-size: 0.82rem; font-weight: 600; color: var(--muted); padding: 6px 10px; }
.pc-price-confirm {
  display: flex; align-items: center; gap: 5px; font-size: 0.82rem; color: var(--accent);
  font-weight: 700; margin: 9px 0 0; font-variant-numeric: tabular-nums;
}
.pc-price-confirm.pending { color: var(--muted); font-weight: 500; }
.pc-unit-toggle { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; flex: 0 0 auto; background: #fff; }
.pc-unit-toggle button {
  border: none; background: #fff; padding: 8px 14px; font-family: var(--sans);
  font-size: 0.82rem; font-weight: 700; color: var(--muted); cursor: pointer;
}
.pc-unit-toggle.small button { padding: 8px 11px; font-size: 0.78rem; }
.pc-unit-toggle button.active { background: var(--brand); color: #fff; }
.pc-qty-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pc-qty-row .pc-input { flex: 1 1 140px; }
.pc-add-btn {
  background: var(--brand); color: #fff; border: none; border-radius: 10px; padding: 13px 16px;
  font-family: var(--sans); font-weight: 700; font-size: 0.9rem; cursor: pointer; width: 100%;
  margin-top: 12px; box-shadow: 0 3px 0 var(--brand-dark);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
}
.pc-add-btn:hover { background: #CB5731; }
.pc-add-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--brand-dark); }
.pc-add-btn:disabled { background: #E0D5C6; color: rgba(42,33,27,0.4); box-shadow: none; cursor: not-allowed; transform: none; }
.pc-ingredient-list { margin-top: 16px; }
.pc-ingredient-row {
  display: flex; justify-content: space-between; align-items: center; padding: 11px 13px;
  background: var(--cream); border: 1px solid var(--line); border-left: 3px solid var(--brand);
  border-radius: 10px; margin-bottom: 8px; gap: 10px;
}
.pc-ingredient-row .left { min-width: 0; }
.pc-ingredient-row .name { font-size: 0.88rem; font-weight: 600; }
.pc-ingredient-row .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.pc-ingredient-row .meta-qty { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pc-ingredient-row .cost { font-size: 0.9rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pc-ingredient-row .right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.pc-remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px; display: flex; }
.pc-empty-note {
  text-align: center; padding: 20px 12px; font-size: 0.84rem; color: var(--muted);
  border: 2px dashed #C9B79C; background: #FFFDF9; border-radius: 12px; line-height: 1.45;
}
.pc-saved-list { display: flex; flex-direction: column; gap: 8px; }
.pc-saved-row {
  display: flex; justify-content: space-between; align-items: center; padding: 11px 13px;
  background: var(--cream); border: 1px solid var(--line); border-radius: 10px; gap: 10px;
}
.pc-saved-row .name { font-size: 0.88rem; font-weight: 600; }
.pc-saved-row .meta { font-size: 0.75rem; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pc-saved-row .right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.pc-saved-row .price { font-size: 0.9rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* mesmo bloco de preço da seção de oferta da landing page */
.pc-hero {
  border-radius: 16px; padding: 26px 20px; text-align: center;
  background: linear-gradient(165deg, var(--ink), var(--ink-2)); margin-bottom: 22px;
}
.pc-hero .eyebrow { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.68rem; font-weight: 700; color: var(--gold-lit); }
.pc-hero .price {
  font-family: var(--serif); font-weight: 700; font-size: clamp(2.2rem, 9.5vw, 2.9rem);
  color: #fff; line-height: 1.1; margin: 8px 0 4px; letter-spacing: -0.015em; font-variant-numeric: tabular-nums;
}
.pc-hero .price .cur { font-size: 0.48em; font-weight: 600; margin-right: 3px; }
.pc-hero .sub { font-size: 0.8rem; color: rgba(221,209,196,0.85); line-height: 1.45; }

.pc-breakdown-row {
  display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line);
  font-size: 0.9rem; font-variant-numeric: tabular-nums;
}
.pc-breakdown-row .lbl { color: var(--muted); font-variant-numeric: normal; }
.pc-breakdown-row.total {
  font-weight: 700; border-bottom: none; border-top: 1.5px solid var(--ink);
  margin-top: 4px; padding-top: 11px; font-size: 0.98rem;
}
.pc-breakdown-row.total .lbl { color: var(--ink); font-weight: 700; }
.pc-ref-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; }
.pc-ref-row .lbl { display: flex; align-items: center; gap: 9px; font-size: 0.86rem; color: var(--muted); }
.pc-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.pc-dot.red { background: var(--danger); }
.pc-dot.mint { background: var(--accent); }
.pc-ref-row .val { font-weight: 700; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }

.pc-diagnostic {
  display: flex; gap: 10px; padding: 14px 15px; border-radius: 12px; font-size: 0.87rem;
  line-height: 1.5; margin-top: 14px; border: 1px solid transparent;
}
.pc-diagnostic svg { flex: 0 0 auto; margin-top: 1px; }
.pc-diagnostic.bom { background: var(--accent-soft); border-color: #CBDDD0; color: #2E4A38; }
.pc-diagnostic.atencao { background: var(--gold-soft); border-color: #EDD9AC; color: #7A5308; }
.pc-diagnostic.ruim { background: var(--danger-soft); border-color: #EFCFC5; color: var(--danger); }

.pc-footer-note { text-align: center; font-size: 0.74rem; color: rgba(42,33,27,0.45); margin-top: 16px; line-height: 1.45; padding: 0 10px; }

/* ---------- V2 ---------- */
.pc-exemplo-cta {
  display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 18px;
  padding: 12px 14px; border-radius: 12px; border: 1.5px dashed var(--brand);
  background: var(--brand-soft); color: var(--brand-dark); font: 600 0.88rem var(--sans);
  text-align: left; cursor: pointer;
}
.pc-exemplo-cta small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 0.76rem; margin-top: 2px; }
.pc-exemplo-cta:hover { background: #F8E2D7; }
.pc-exemplo-banner {
  margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft);
  border: 1px solid #EDD9AC; color: #7A5308; font-size: 0.82rem; line-height: 1.45;
}
.pc-exemplo-banner strong { display: block; font-size: 0.86rem; margin-bottom: 2px; }
.pc-exemplo-banner .acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pc-mini-btn {
  border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 9px;
  padding: 7px 11px; font: 600 0.78rem var(--sans); cursor: pointer;
}
.pc-mini-btn.cheio { background: var(--brand); border-color: var(--brand); color: #fff; }
.pc-mini-btn:disabled { opacity: .45; cursor: default; }
.pc-saved-row { flex-wrap: wrap; }
.pc-saved-acoes { display: flex; gap: 6px; width: 100%; margin-top: 8px; color: var(--brand-dark); }
.pc-saved-acoes .pc-mini-btn { padding: 5px 10px; font-size: 0.74rem; }
.pc-saved-aviso { width: 100%; font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
.pc-editando {
  margin: 0 0 14px; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft);
  color: #2E4A38; font-size: 0.8rem;
}
.pc-edit-btn {
  border: 0; background: transparent; color: var(--brand-dark); font: 600 0.74rem var(--sans);
  cursor: pointer; padding: 6px 4px; text-decoration: underline;
}
.pc-hero .arred { font-size: 0.74rem; opacity: .8; margin-top: 4px; }
.pc-ficha-acoes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0 4px; }
.pc-ficha-acoes button {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 6px;
  border-radius: 11px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  font: 600 0.76rem var(--sans); cursor: pointer;
}
.pc-ficha-acoes button.wpp { border-color: #25D366; color: #128C4A; }
.pc-ficha-acoes button:hover { background: var(--cream); }
.pc-semaforo {
  display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; padding: 14px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--paper);
}
.pc-semaforo .luzes {
  display: flex; flex-direction: column; gap: 5px; padding: 6px 5px; border-radius: 999px;
  background: #2A211B; flex: 0 0 auto;
}
.pc-semaforo .luz { width: 14px; height: 14px; border-radius: 50%; opacity: .22; }
.pc-semaforo .luz.r { background: #E5533D; } .pc-semaforo .luz.a { background: #F2B24C; } .pc-semaforo .luz.v { background: #4CB571; }
.pc-semaforo .luz.on { opacity: 1; }
.pc-semaforo .luz.r.on { box-shadow: 0 0 10px #E5533D; } .pc-semaforo .luz.a.on { box-shadow: 0 0 10px #F2B24C; } .pc-semaforo .luz.v.on { box-shadow: 0 0 10px #4CB571; }
.pc-semaforo .txt strong { display: block; font-size: 0.92rem; margin-bottom: 3px; }
.pc-semaforo .txt { font-size: 0.83rem; line-height: 1.45; }
.pc-semaforo.ruim { background: var(--danger-soft); border-color: #EFCFC5; color: var(--danger); }
.pc-semaforo.atencao { background: var(--gold-soft); border-color: #EDD9AC; color: #7A5308; }
.pc-semaforo.bom { background: var(--accent-soft); border-color: #CBDDD0; color: #2E4A38; }
.pc-toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 10px 16px; border-radius: 10px; font-size: 0.84rem; z-index: 60; box-shadow: var(--shadow);
}
.pc-video-erro { padding: 18px; text-align: center; color: #fff; font-size: 0.86rem; }
.pc-video-erro a { color: var(--gold-lit); font-weight: 600; }
/* ---------- V2: ferramentas ---------- */
/* todas as ferramentas visíveis de uma vez (2 linhas de 3), sem rolagem escondida */
.pc-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 0; padding: 0 0 12px; }
.pc-chip {
  padding: 7px 6px; text-align: center; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.06); color: rgba(246,239,230,0.85); font: 600 0.76rem var(--sans);
  cursor: pointer; white-space: nowrap;
}
.pc-chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.pc-header-badge img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.pc-header-badge.com-logo { background: #fff; }
.pc-res {
  border-radius: 14px; padding: 16px; margin: 14px 0; background: linear-gradient(165deg, var(--ink), var(--ink-2)); color: #fff;
}
.pc-res .eyebrow { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.66rem; font-weight: 700; color: var(--gold-lit); }

/* ---------------- utilidades ---------------- */
function toNum(v, fallback) {
  if (fallback === undefined) fallback = 0;
  if (v === "" || v === null || v === undefined) return fallback;
  var n = parseFloat(String(v).replace(",", "."));
  return isNaN(n) ? fallback : n;
}
function formatBRL(n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatPct(n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  return n.toFixed(1).replace(".", ",") + "%";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function $(sel) { return document.querySelector(sel); }

/* ---------------- armazenamento local ----------------
   Nada disso é "cache": é localStorage, preso a este aparelho e a este endereço.
   Some só se a pessoa apagar os dados do site, usar aba anônima ou trocar de celular.
   Nenhum dado sai do aparelho — não existe servidor nem conta.
   Envolvido em try/catch porque navegador com cookies bloqueados lança erro ao ler/gravar;
   nesse caso a calculadora continua funcionando, só não guarda nada.                       */
var SALVOS_KEY = "kustos_marmitas_salvas_v1";
var CONFIG_KEY = "preco_certo_negocio_v1"; // <- novo: guarda os dados do negócio

function lerJSON(chave, padrao) {
  try {
    if (typeof localStorage === "undefined") return padrao;
    var raw = localStorage.getItem(chave);
    return raw ? JSON.parse(raw) : padrao;
  } catch (e) { return padrao; }
}
function escreverJSON(chave, valor) {
  try {
    if (typeof localStorage === "undefined") return false;
    localStorage.setItem(chave, JSON.stringify(valor));
    return true;
  } catch (e) { return false; }
}

/* ---------------- V2: exemplo pronto ---------------- */
function acharIngrediente(nome) {
  for (var i = 0; i < INGREDIENTES.length; i++) if (INGREDIENTES[i].n === nome) return INGREDIENTES[i];
  return null;
}

// monta um item da receita a partir do ingrediente, do preço pago e da quantidade usada
function montarItem(ing, pagoStr, veioStr, unidadeVeio, qtd, unidadeUso) {
  var custoNativo = calcularCustoPorUnidadeNativa(ing, pagoStr, veioStr, unidadeVeio);
  if (custoNativo === null) return null;
  var grande = unidadeGrande(ing.u);
  var qtdNativa = (grande && unidadeUso === grande) ? qtd * 1000 : qtd;
  var mult = (ing.u === "g" || ing.u === "ml") ? 1000 : 1;
  return {
    id: Date.now() + Math.random(),
    nome: ing.n, cat: ing.c, unidade: unidadeUso, qtd: qtd,
    custoLinha: (qtdNativa * custoNativo) / mult,
    // V2: guarda o "quanto paguei / quanto veio" para poder corrigir depois
    pago: String(pagoStr), veio: String(veioStr), unidadeVeio: unidadeVeio,
    u: ing.u, ap: ing.ap != null ? ing.ap : (ing.pd != null ? 1 - ing.pd : 1)
  };
}

function precoRefDe(ing) {
  var grande = unidadeGrande(ing.u);
  if (grande && ing.f >= 1000 && ing.f % 1000 === 0) return { veio: String(ing.f / 1000), unidade: grande };
  return { veio: String(ing.f), unidade: ing.u };
}

function usarExemplo() {
  if (!st.modoExemplo) st.negocioAntesExemplo = Object.assign({}, st.negocio);
  st.modoExemplo = true;
  st.editandoId = null;
  st.negocio = Object.assign({}, EXEMPLO.negocio);
  st.nomeReceita = EXEMPLO.nome;
  st.rendimento = EXEMPLO.rendimento;
  st.tempoPreparo = EXEMPLO.tempoPreparo;
  st.embalagem = EXEMPLO.embalagem;
  st.precoAtual = "";
  st.itens = [];
  EXEMPLO.itens.forEach(function (e) {
    var ing = acharIngrediente(e[0]);
    if (!ing) return;
    var ref = precoRefDe(ing);
    var item = montarItem(ing, String(ing.pg).replace(".", ","), ref.veio, ref.unidade, e[1], e[2]);
    if (item) st.itens.push(item);
  });
  irPara(3);
}

function limparExemplo() {
  st.modoExemplo = false;
  st.negocio = Object.assign({}, NEGOCIO_PADRAO, lerJSON(CONFIG_KEY, {}));
  st.negocioAntesExemplo = null;
  novaReceitaEmBranco();
  irPara(1);
}

function manterExemplo() {
  // a pessoa decidiu partir do exemplo: agora os números passam a ser dela
  st.modoExemplo = false;
  st.negocioAntesExemplo = null;
  st.nomeReceita = st.nomeReceita.replace(/\s*\(EXEMPLO\)\s*$/, "");
  salvarConfigNegocio();
  irPara(1);
}

function novaReceitaEmBranco() {
  st.editandoId = null;
  st.editandoItem = null;
  st.nomeReceita = ""; st.rendimento = ""; st.tempoPreparo = ""; st.embalagem = "";
  st.itens = []; st.precoAtual = "";
  st.selecionado = null; st.busca = ""; st.qtdBusca = "";
}

/* ---------------- cálculo (idêntico à planilha "O Preço Certo") ---------------- */
function unidadeGrande(uNativa) {
  if (uNativa === "g") return "kg";
  if (uNativa === "ml") return "L";
  return null;
}

// preço por unidade nativa (kg/L/un), a partir do que a pessoa realmente sabe:
// quanto pagou + quanto veio no pacote.
function calcularCustoPorUnidadeNativa(ing, pagoStr, qtdVeioStr, unidadeVeio) {
  if (!ing) return null;
  var pago = toNum(pagoStr, NaN);
  var qtdVeio = toNum(qtdVeioStr, NaN);
  if (!isFinite(pago) || !isFinite(qtdVeio) || qtdVeio <= 0) return null;
  var grande = unidadeGrande(ing.u);
  var qtdVeioNaUnidadeNativa = grande && unidadeVeio === grande ? qtdVeio * 1000 : qtdVeio;
  var aprovOuPerda = ing.ap != null ? ing.ap : (ing.pd != null ? 1 - ing.pd : 1);
  var qtdUtil = qtdVeioNaUnidadeNativa * aprovOuPerda;
  if (qtdUtil <= 0) return null;
  var mult = (ing.u === "g" || ing.u === "ml") ? 1000 : 1;
  return (pago / qtdUtil) * mult;
}

function custoUnidadeAtual() {
  return st.selecionado
    ? calcularCustoPorUnidadeNativa(st.selecionado, st.pagoEditavel, st.qtdVeioEditavel, st.unidadePagoEscolhida)
    : null;
}

function calcular() {
  var diasN = toNum(st.negocio.dias);
  var marmitasDiaN = toNum(st.negocio.marmitasDia);
  var marmitasMes = diasN * marmitasDiaN;
  var despesaFixaRateada = marmitasMes > 0 ? toNum(st.negocio.despesaFixa) / marmitasMes : null;

  var rendimentoN = toNum(st.rendimento);
  var custoIngredientesLote = st.itens.reduce(function (s, i) { return s + i.custoLinha; }, 0);
  var custoIngredientePorMarmita = rendimentoN > 0 ? custoIngredientesLote / rendimentoN : null;

  var custoMaoDeObraLote = (toNum(st.tempoPreparo) / 60) * toNum(st.negocio.valorHora);
  var custoMaoDeObraPorMarmita = rendimentoN > 0 ? custoMaoDeObraLote / rendimentoN : null;

  var embalagemN = toNum(st.embalagem);

  var custoTotal = (custoIngredientePorMarmita !== null && despesaFixaRateada !== null)
    ? custoIngredientePorMarmita + embalagemN + (custoMaoDeObraPorMarmita || 0) + despesaFixaRateada
    : null;

  var impostosFrac = toNum(st.negocio.impostos) / 100;
  var margemFrac = toNum(st.negocio.margem) / 100;

  var precoMinimo = (custoTotal !== null && 1 - impostosFrac > 0) ? custoTotal / (1 - impostosFrac) : null;
  var precoRecomendado = (custoTotal !== null && 1 - impostosFrac - margemFrac > 0)
    ? custoTotal / (1 - impostosFrac - margemFrac) : null;
  var precoArredondado = precoRecomendado !== null ? Math.ceil(precoRecomendado) : null;

  return {
    marmitasMes: marmitasMes, despesaFixaRateada: despesaFixaRateada,
    custoIngredientePorMarmita: custoIngredientePorMarmita,
    custoMaoDeObraPorMarmita: custoMaoDeObraPorMarmita,
    embalagemN: embalagemN, custoTotal: custoTotal,
    impostosFrac: impostosFrac, margemFrac: margemFrac,
    precoMinimo: precoMinimo, precoRecomendado: precoRecomendado, precoArredondado: precoArredondado
  };
}

function calcularDiagnostico(c) {
  if (st.precoAtual === "") return null;
  var precoAtualN = toNum(st.precoAtual);
  if (c.custoTotal === null) return null;
  var lucro = precoAtualN - c.custoTotal - precoAtualN * c.impostosFrac;
  var margemReal = precoAtualN > 0 ? lucro / precoAtualN : -1;
  if (precoAtualN < c.custoTotal) {
    return { tipo: "ruim", texto: "Você está vendendo no prejuízo: perde " + formatBRL(c.custoTotal - precoAtualN) + " em cada marmita." };
  }
  if (c.precoMinimo !== null && precoAtualN < c.precoMinimo) {
    return { tipo: "ruim", texto: "Esse preço cobre os ingredientes, mas não cobre os impostos. O mínimo pra não trabalhar de graça é " + formatBRL(c.precoMinimo) + "." };
  }
  if (margemReal < c.margemFrac) {
    return { tipo: "atencao", texto: "Você tem lucro, mas a margem está em " + formatPct(margemReal * 100) + ", abaixo dos " + st.negocio.margem + "% que você quer. Pra chegar lá, cobre " + formatBRL(c.precoRecomendado) + "." };
  }
  return { tipo: "bom", texto: "Esse preço cobre tudo e ainda entrega a margem de " + st.negocio.margem + "% que você quer." };
}

function podeAvancar1() {
  return toNum(st.negocio.despesaFixa) >= 0 && toNum(st.negocio.dias) > 0 &&
         toNum(st.negocio.marmitasDia) > 0 && toNum(st.negocio.valorHora) >= 0;
}
function podeAvancar2() { return toNum(st.rendimento) > 0 && st.itens.length > 0; }

function renderResultados() {

  if (!q) { box.innerHTML = ""; return; }

  var achados = [];
  for (var i = 0; i < INGREDIENTES.length && achados.length < 7; i++) {
    if (INGREDIENTES[i].busca.indexOf(q) !== -1) achados.push(INGREDIENTES[i]);

  box.innerHTML = achados.map(function (ing) {
    return '<button type="button" class="pc-search-item" data-nome="' + esc(ing.n) + '">' +
      '<span class="name">' + esc(ing.n) + "</span>" +
      '<span class="pc-tag">' + esc(ing.c) + "</span></button>";
  }).join("");

  Array.prototype.forEach.call(box.children, function (btn) {
    btn.addEventListener("click", function () {
      var ing = INGREDIENTES.find(function (x) { return x.n === btn.dataset.nome; });
      selecionarIngrediente(ing);
    });
  });

function selecionarIngrediente(ing) {

  var grandeCompra = unidadeGrande(ing.u);
  // mostra "quanto veio" do jeito mais natural: kg/L quando o pacote é grande (múltiplo de 1000)
  if (grandeCompra && ing.f >= 1000 && ing.f % 1000 === 0) {
    st.qtdVeioEditavel = String(ing.f / 1000);
    st.unidadePagoEscolhida = grandeCompra;
  } else {
    st.qtdVeioEditavel = String(ing.f);
    st.unidadePagoEscolhida = ing.u;
  }
  st.unidadeEscolhida = ing.u;
  renderAreaIngrediente();
}

function atualizarPrecoConfirm() {
  var sel = st.selecionado;
  if (!sel) return;
  var custo = custoUnidadeAtual();
  var rotulo = sel.u === "un" ? "un" : (sel.u === "g" ? "kg" : "L");
  var p = $("#precoConfirm");
  if (custo !== null) {
    p.className = "pc-price-confirm";
    p.innerHTML = icone("checkCircle", 13) + " " + formatBRL(custo) + " por " + rotulo;
  } else {
    p.className = "pc-price-confirm pending";
    p.textContent = "preencha os dois campos acima";
  }
  $("#btnAdicionar").disabled = toNum(st.qtdBusca) <= 0 || custo === null;
}

function adicionarIngrediente() {
  var sel = st.selecionado;
  if (!sel) return;
  var qtdDigitada = toNum(st.qtdBusca, 0);
  if (qtdDigitada <= 0) return;
  var custoPorUnidadeNativa = custoUnidadeAtual();
  if (custoPorUnidadeNativa === null) return;

  // V2: o item guarda também quanto pagou / quanto veio, para poder ser corrigido depois
  var item = montarItem(sel, st.pagoEditavel, st.qtdVeioEditavel, st.unidadePagoEscolhida, qtdDigitada, st.unidadeEscolhida);
  if (!item) return;
  if (st.editandoItem && st.editandoItem.pos != null) {
    st.itens.splice(Math.min(st.editandoItem.pos, st.itens.length), 0, item); // volta para o mesmo lugar
  } else {
    st.itens.push(item);
  }
  st.editandoItem = null;

  st.selecionado = null;
  st.busca = "";
  st.qtdBusca = "";
  st.pagoEditavel = "";
  st.qtdVeioEditavel = "";
  renderAreaIngrediente();
  renderListaIngredientes();
  atualizarBotaoAvancar2();
}

    '<div class="pc-field" style="margin-bottom:12px"><label class="pc-label" for="f-pers">Nome do produto</label>' +
    '<input class="pc-input text" id="f-pers" placeholder="ex: Farinha de mandioca" value="' + esc(st.nomePersonalizado) + '"></div>' +
    '<div class="pc-field" style="margin-bottom:4px"><label class="pc-label">Como você compra esse produto?</label>' +
    '<div class="pc-unit-toggle" style="width:100%">' + op("g", "Peso (g/kg)") + op("ml", "Volume (ml/L)") + op("un", "Unidade") + "</div></div>" +
    '<div class="pc-btn-row" style="margin-top:14px">' +
    '<button type="button" class="pc-btn pc-btn-ghost" id="btnCancelarPers">' + icone("arrowLeft", 17) + "</button>" +
    '<button type="button" class="pc-btn pc-btn-primary" id="btnConfirmarPers">Adicionar esse produto</button></div></div>';
}

function ligarPersonalizado() {
  var campo = $("#f-pers");
  campo.addEventListener("input", function () {
    st.nomePersonalizado = this.value;
    $("#btnConfirmarPers").disabled = !st.nomePersonalizado.trim();
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pers]"), function (b) {
    b.addEventListener("click", function () { st.unidadePersonalizada = b.dataset.pers; renderAreaIngrediente(); });
  });
  $("#btnCancelarPers").addEventListener("click", function () {
    st.mostrarPersonalizado = false; st.nomePersonalizado = ""; renderAreaIngrediente();
  });
  $("#btnConfirmarPers").addEventListener("click", confirmarPersonalizado);
  $("#btnConfirmarPers").disabled = !st.nomePersonalizado.trim();
}

// ingrediente digitado por ela mesma — mesma lógica de "quanto pagou / quanto veio",
// só sem preço de referência.
function confirmarPersonalizado() {
  if (!st.nomePersonalizado.trim()) return;
  st.selecionado = { n: st.nomePersonalizado.trim(), c: "Personalizado", u: st.unidadePersonalizada, ap: 1 };
  st.busca = st.selecionado.n;
  st.qtdBusca = "";
  st.pagoEditavel = "";
  st.qtdVeioEditavel = "";
  st.unidadePagoEscolhida = st.unidadePersonalizada;
  st.unidadeEscolhida = st.unidadePersonalizada;
  st.mostrarPersonalizado = false;
  st.nomePersonalizado = "";
  renderAreaIngrediente();
}

function renderListaIngredientes() {
  var lista = $("#listaIngredientes");
  if (!lista) return;
  if (st.itens.length === 0) {
    lista.innerHTML = '<div class="pc-empty-note">Nenhum ingrediente ainda — busque acima e adicione o primeiro.</div>';
    return;
  }
  lista.innerHTML = st.itens.map(function (i) {
    return '<div class="pc-ingredient-row"><div class="left">' +
      '<div class="name">' + esc(i.nome) + "</div>" +
      '<div class="meta"><span class="meta-qty">' + esc(String(i.qtd).replace(".", ",")) + " " + esc(i.unidade === "un" ? "un" : i.unidade) + "</span>" +
      '<span class="pc-tag">' + esc(i.cat) + "</span></div></div>" +
      '<div class="right"><span class="cost">' + formatBRL(i.custoLinha) + "</span>" +
      '<button type="button" class="pc-edit-btn" data-corrigir="' + i.id + '" aria-label="Corrigir ' + esc(i.nome) + '">corrigir</button>' +
      '<button type="button" class="pc-remove-btn" data-remover="' + i.id + '" aria-label="Remover ' + esc(i.nome) + '">' + icone("x", 16) + "</button></div></div>";
  }).join("");

  Array.prototype.forEach.call(lista.querySelectorAll("[data-corrigir]"), function (b) {
    b.addEventListener("click", function () { corrigirItem(b.dataset.corrigir); });
  });

  Array.prototype.forEach.call(lista.querySelectorAll("[data-remover]"), function (b) {
    b.addEventListener("click", function () {
      st.itens = st.itens.filter(function (i) { return String(i.id) !== b.dataset.remover; });
      renderListaIngredientes();
      atualizarBotaoAvancar2();
    });
  });
}

// V2: tira o ingrediente da lista e abre de novo com o preço pago e a quantidade preenchidos
function corrigirItem(idStr) {
  if (st.editandoItem) cancelarSelecao(); // só um ingrediente aberto por vez
  var pos = -1;
  for (var k = 0; k < st.itens.length; k++) if (String(st.itens[k].id) === idStr) pos = k;
  if (pos < 0) return;
  var item = st.itens[pos];
  var ing = acharIngrediente(item.nome) ||
    { n: item.nome, c: item.cat || "Personalizado", u: item.u || (item.unidade === "kg" ? "g" : item.unidade === "L" ? "ml" : item.unidade), ap: item.ap != null ? item.ap : 1 };
  st.itens.splice(pos, 1);
  st.editandoItem = { pos: pos, original: item };
  st.selecionado = ing;
  st.busca = ing.n;
  if (item.pago != null) {
    st.pagoEditavel = item.pago;
    st.qtdVeioEditavel = item.veio;
    st.unidadePagoEscolhida = item.unidadeVeio;
  } else {
    var ref = precoRefDe(ing);
    st.pagoEditavel = ing.pg != null ? String(ing.pg).replace(".", ",") : "";
    st.qtdVeioEditavel = ing.pg != null ? ref.veio : "";
    st.unidadePagoEscolhida = ref.unidade;
  }
  st.unidadeEscolhida = item.unidade;
  st.qtdBusca = String(item.qtd).replace(".", ",");
  renderAreaIngrediente();
  renderListaIngredientes();
  atualizarBotaoAvancar2();
  var area = $("#areaIngrediente");
  if (area && area.scrollIntoView) area.scrollIntoView({ block: "center" });
}

function cancelarSelecao() {
  if (st.editandoItem) {
    st.itens.splice(Math.min(st.editandoItem.pos, st.itens.length), 0, st.editandoItem.original);
    st.editandoItem = null;
  }
  st.selecionado = null; st.busca = ""; st.qtdBusca = ""; st.pagoEditavel = ""; st.qtdVeioEditavel = "";
  renderAreaIngrediente();
  renderListaIngredientes();
  atualizarBotaoAvancar2();
}

/* ---------------- passo 3 ---------------- */

    '<div class="pc-hero"><div class="eyebrow">preço recomendado</div>' +
    '<div class="price"><span class="cur">R$</span>' +
    (c.precoArredondado !== null ? c.precoArredondado.toFixed(2).replace(".", ",") : "—") + "</div>" +
    '<div class="sub">cobre custo, impostos e ' + esc(st.negocio.margem) + "% de margem</div>" +
    (arredondou ? '<div class="arred">o cálculo deu ' + formatBRL(c.precoRecomendado) + " — arredondamos para cima</div>" : "") +
    "</div>" +

      '<button type="button" id="btnCopiar">' + icone("check", 18) + "Copiar</button>" +
      '<button type="button" id="btnImprimir">' + icone("utensils", 18) + "Imprimir</button>" +
    "</div>" +
    '<p class="pc-help" style="margin-bottom:6px">Ficha técnica com o peso de cada ingrediente por marmita, o custo e o preço. Mande para o seu WhatsApp ou para quem ajuda na cozinha.</p>' +

    '<div class="pc-section-label">Custo por marmita</div>' +
    linhaCusto("Ingredientes", c.custoIngredientePorMarmita) +
    linhaCusto("Embalagem", c.embalagemN) +
    linhaCusto("Mão de obra", c.custoMaoDeObraPorMarmita) +
    linhaCusto("Despesa fixa rateada", c.despesaFixaRateada) +
    '<div class="pc-breakdown-row total"><span class="lbl">Sua marmita custa</span><span>' + formatBRL(c.custoTotal) + "</span></div>" +

    '<div class="pc-section-label">Referências</div>' +
    '<div class="pc-ref-row"><span class="lbl"><span class="pc-dot red"></span>Limite mínimo (sem lucro)</span>' +
    '<span class="val">' + formatBRL(c.precoMinimo) + "</span></div>" +
    '<div class="pc-ref-row"><span class="lbl"><span class="pc-dot mint"></span>Recomendado (com sua margem)</span>' +
    '<span class="val">' + formatBRL(c.precoRecomendado) + "</span></div>" +

    '<div class="pc-field" style="margin-top:18px"><label class="pc-label" for="f-atual">Quanto você cobra hoje? (opcional)</label>' +

    '<div id="areaDiagnostico"></div>' +

    '<div class="pc-btn-row">' +
    '<button type="button" class="pc-btn pc-btn-ghost" id="btnVoltar3">' + icone("arrowLeft", 17) + "</button>" +
    '<button type="button" class="pc-btn pc-btn-primary" id="btnSalvar">' + textoBotaoSalvar() + "</button></div>" +
    (st.editandoId !== null && !st.modoExemplo
      ? '<button type="button" class="pc-link-btn" id="btnSalvarNova" style="display:block;margin:8px auto 0">Guardar como uma marmita nova</button>' : "") +
    '<p class="pc-help" style="text-align:center;margin-top:8px">' +
    (st.modoExemplo ? "O exemplo não é guardado. Toque em “Partir deste exemplo e ajustar” para guardar." :
      "Salva só neste aparelho, sem precisar de internet pra abrir depois.") + "</p>" +
    '<button type="button" class="pc-link-btn" id="btnNovaReceita" style="display:flex;align-items:center;gap:4px;margin:6px auto 0">' + icone("plus", 14) + " Começar outra marmita</button>" +

function linhaCusto(rotulo, valor) {
  return '<div class="pc-breakdown-row"><span class="lbl">' + rotulo + "</span><span>" + formatBRL(valor) + "</span></div>";
}

// V2: semáforo do lucro. Usa os números da própria pessoa; "sobra" já desconta o pagamento da hora dela.
var LIMITE_AMARELO = 2; // R$ por marmita

function renderDiagnostico() {
  var area = $("#areaDiagnostico");
  if (!area) return;
  var c = calcular();
  if (st.precoAtual === "" || c.custoTotal === null) { area.innerHTML = ""; return; }
  var preco = toNum(st.precoAtual);
  var sobra = preco - c.custoTotal - preco * c.impostosFrac;
  var margemReal = preco > 0 ? sobra / preco : -1;
  var tipo, titulo, texto;

  if (sobra < -0.004) {
    tipo = "ruim"; titulo = "Vermelho: prejuízo";
    texto = "Com " + formatBRL(preco) + ", você paga " + formatBRL(-sobra) + " do próprio bolso em cada marmita vendida" +
      (c.impostosFrac > 0 ? " (contando os impostos)" : "") + ". Pra não perder, o mínimo é " + formatBRL(c.precoMinimo) + ".";
  } else if (sobra < LIMITE_AMARELO) {
    tipo = "atencao"; titulo = "Amarelo: lucro no limite";
    texto = "Sobra só " + formatBRL(sobra) + " por marmita. Qualquer aumento de ingrediente, gás ou embalagem come esse lucro. " +
      "Pra ter a margem de " + st.negocio.margem + "% que você quer, cobre " + formatBRL(c.precoArredondado) + ".";
  } else if (margemReal < c.margemFrac) {
    tipo = "atencao"; titulo = "Amarelo: margem abaixo da sua meta";
    texto = "Sobra " + formatBRL(sobra) + " por marmita (margem de " + formatPct(margemReal * 100) + "), abaixo dos " +
      st.negocio.margem + "% que você quer. Pra chegar lá, cobre " + formatBRL(c.precoArredondado) + ".";
  } else {
    tipo = "bom"; titulo = "Verde: preço saudável";
    texto = "Sobra " + formatBRL(sobra) + " por marmita (margem de " + formatPct(margemReal * 100) +
      ") depois de pagar ingredientes, embalagem, despesas e a sua hora. Sua margem está protegida.";
  }

  area.innerHTML = '<div class="pc-semaforo ' + tipo + '" role="status">' +
    '<div class="luzes" aria-hidden="true"><span class="luz r' + (tipo === "ruim" ? " on" : "") + '"></span>' +
    '<span class="luz a' + (tipo === "atencao" ? " on" : "") + '"></span>' +
    '<span class="luz v' + (tipo === "bom" ? " on" : "") + '"></span></div>' +
    '<div class="txt"><strong>' + esc(titulo) + "</strong>" + esc(texto) + "</div></div>";
}

/* ---------------- V2: marmitas salvas com a receita completa ---------------- */
function textoBotaoSalvar() {
  return st.editandoId !== null && !st.modoExemplo ? "Atualizar esta marmita" : "Guardar minha marmita";
}

function salvarMarmita(comoNova) {
  if (st.modoExemplo) return;
  var c = calcular();
  var registro = {
    // campos da V1 (a V1 continua lendo a lista normalmente)
    id: Date.now(),
    nome: st.nomeReceita || "Marmita sem nome",
    data: new Date().toLocaleDateString("pt-BR"),
    custoTotal: c.custoTotal,
    precoRecomendado: c.precoRecomendado,
    precoArredondado: c.precoArredondado,
    qtdIngredientes: st.itens.length,
    // V2: parte do custo que é despesa fixa rateada (a tela Meta de lucro precisa separar)
    custoFixoRateado: c.despesaFixaRateada,
    // V2: a receita inteira, para abrir, corrigir e duplicar
    v: 2,
    receita: {
      nome: st.nomeReceita, rendimento: st.rendimento, tempoPreparo: st.tempoPreparo,
      embalagem: st.embalagem, precoAtual: st.precoAtual,
      itens: st.itens.map(function (i) { return Object.assign({}, i); })
    }
  };

  var atualizou = false;
  if (!comoNova && st.editandoId !== null) {
    var pos = -1;
    for (var k = 0; k < st.salvos.length; k++) if (st.salvos[k].id === st.editandoId) pos = k;
    if (pos >= 0) {
      registro.id = st.editandoId;
      st.salvos.splice(pos, 1);
      atualizou = true;
    }
  }
  st.salvos = [registro].concat(st.salvos).slice(0, 30); // guarda até 30 mais recentes
  if (!escreverJSON(SALVOS_KEY, st.salvos)) {
    toast("Não deu para guardar: o navegador está bloqueando o armazenamento.");
    return;
  }
  st.editandoId = registro.id;

  var btn = $("#btnSalvar");
  btn.innerHTML = icone("checkCircle", 17) + (atualizou ? " Atualizada!" : " Salvo!");
  setTimeout(function () {
    var b = $("#btnSalvar");
    if (b) b.textContent = textoBotaoSalvar();
  }, 2200);
  if (comoNova) renderStep3(); else renderSalvos();
}

function carregarReceita(s, modo) {
  // modo: "abrir" (edita a mesma), "duplicar" (cria outra), "refazer" (salva antiga sem receita)
  if (st.modoExemplo) { st.modoExemplo = false; st.negocio = Object.assign({}, NEGOCIO_PADRAO, lerJSON(CONFIG_KEY, {})); }
  novaReceitaEmBranco();
  if (s.receita) {
    var r = s.receita;
    st.nomeReceita = modo === "duplicar" ? (r.nome || s.nome) + " (cópia)" : (r.nome || s.nome);
    st.rendimento = r.rendimento || "";
    st.tempoPreparo = r.tempoPreparo || "";
    st.embalagem = r.embalagem || "";
    st.precoAtual = r.precoAtual || "";
    st.itens = (r.itens || []).map(function (i) { return Object.assign({}, i, { id: Date.now() + Math.random() }); });
  } else {
    st.nomeReceita = s.nome;
  }
  st.editandoId = modo === "duplicar" ? null : s.id;
  irPara(modo === "abrir" && s.receita ? 3 : 2);
  if (modo === "duplicar") toast("Cópia criada. Troque o que mudou e guarde.");
  if (modo === "refazer") toast("Preço antigo guardado: " + formatBRL(s.precoArredondado) + ". Coloque os ingredientes.");
}

function renderSalvos() {
  var area = $("#areaSalvos");
  if (!area) return;
  if (!st.salvos.length) { area.innerHTML = ""; return; }
  area.innerHTML = '<div class="pc-section-label">Minhas marmitas (neste aparelho)</div><div class="pc-saved-list">' +
    st.salvos.map(function (s) {
      var temReceita = !!s.receita;
      var acoes = temReceita
        ? '<button type="button" class="pc-mini-btn" data-acao="abrir" data-id="' + s.id + '">Abrir</button>' +
          '<button type="button" class="pc-mini-btn" data-acao="duplicar" data-id="' + s.id + '">Duplicar</button>'
        : '<button type="button" class="pc-mini-btn" data-acao="refazer" data-id="' + s.id + '">Refazer esta marmita</button>';
      return '<div class="pc-saved-row"><div><div class="name">' + esc(s.nome) +
        (st.editandoId === s.id ? ' <span class="pc-tag">aberta</span>' : "") + "</div>" +
        '<div class="meta">' + esc(s.data) + " · " + s.qtdIngredientes + " ingrediente" + (s.qtdIngredientes === 1 ? "" : "s") + "</div></div>" +
        '<div class="right"><span class="price">' + formatBRL(s.precoArredondado) + "</span>" +
        '<button type="button" class="pc-remove-btn" data-excluir="' + s.id + '" aria-label="Excluir ' + esc(s.nome) + '">' + icone("x", 16) + "</button></div>" +
        '<div class="pc-saved-acoes">' + acoes + "</div>" +
        (temReceita ? "" : '<div class="pc-saved-aviso">Guardada antes da atualização, só com o resumo. Refaça uma vez para poder abrir e duplicar.</div>') +
        "</div>";
    }).join("") + "</div>";

  Array.prototype.forEach.call(area.querySelectorAll("[data-acao]"), function (b) {
    b.addEventListener("click", function () {
      var s = st.salvos.find(function (x) { return String(x.id) === b.dataset.id; });
      if (s) carregarReceita(s, b.dataset.acao);
    });
  });
  Array.prototype.forEach.call(area.querySelectorAll("[data-excluir]"), function (b) {
    b.addEventListener("click", function () {
      var s = st.salvos.find(function (x) { return String(x.id) === b.dataset.excluir; });
      if (s && !window.confirm("Apagar a marmita “" + s.nome + "”? Não dá para desfazer.")) return;
      st.salvos = st.salvos.filter(function (x) { return String(x.id) !== b.dataset.excluir; });
      if (st.editandoId !== null && String(st.editandoId) === b.dataset.excluir) st.editandoId = null;
      escreverJSON(SALVOS_KEY, st.salvos);
      renderSalvos();
    });
  });
}

/* ---------------- V2: ficha técnica ---------------- */
function fmtQtd(n, casas) {
  return n.toLocaleString("pt-BR", { maximumFractionDigits: casas });
}

// quantidade de um ingrediente em UMA marmita, na unidade mais legível
function qtdPorMarmita(item, rend) {
  var q = item.qtd / rend;
  if (item.unidade === "kg") return fmtQtd(q * 1000, q * 1000 < 10 ? 1 : 0) + " g";
  if (item.unidade === "L") return fmtQtd(q * 1000, q * 1000 < 10 ? 1 : 0) + " ml";
  if (item.unidade === "g" || item.unidade === "ml") return fmtQtd(q, q < 10 ? 1 : 0) + " " + item.unidade;
  return fmtQtd(q, 2) + " un";
}

function dadosFicha() {
  var c = calcular();
  var rend = toNum(st.rendimento);
  return {
    c: c, rend: rend,
    nome: st.nomeReceita || "Minha marmita",
    linhas: st.itens.map(function (i) {
      return { nome: i.nome, porMarmita: rend > 0 ? qtdPorMarmita(i, rend) : "—",
               lote: fmtQtd(i.qtd, 2) + " " + (i.unidade === "un" ? "un" : i.unidade) };
    })
  };
}

function textoFicha() {
  var d = dadosFicha();
  var m = typeof marcaAtual === "function" ? marcaAtual() : {};
  var t = (m.nome ? "*" + m.nome + "*\n" : "") +
    "*FICHA TÉCNICA: " + d.nome.toUpperCase() + "*\n" +
    "Receita rende " + fmtQtd(d.rend, 0) + " marmitas\n\n" +
    "*Por marmita:*\n" +
    d.linhas.map(function (l) { return "• " + l.nome + ": " + l.porMarmita; }).join("\n") +
    "\n\n*Receita inteira (" + fmtQtd(d.rend, 0) + " marmitas):*\n" +
    d.linhas.map(function (l) { return "• " + l.nome + ": " + l.lote; }).join("\n") +
    "\n\nCusto por marmita: " + formatBRL(d.c.custoTotal) +
    "\n*Preço de venda: " + formatBRL(d.c.precoArredondado) + "*" +
    "\n\n_feito na calculadora Preço Certo_";
  return t;
}

function enviarWhatsApp() {
  var url = "https://wa.me/?text=" + encodeURIComponent(textoFicha());
  window.open(url, "_blank", "noopener");
}

function copiarFicha() {
  var t = textoFicha();
  function ok() { toast("Ficha copiada. É só colar onde quiser."); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(ok, function () { copiaManual(t); });
  } else copiaManual(t);
}

function copiaManual(t) {
  var ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  var deu = false;
  try { deu = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  toast(deu ? "Ficha copiada. É só colar onde quiser." : "Não deu para copiar neste navegador. Use o botão do WhatsApp.");
}

function imprimirFicha() {
  var d = dadosFicha();
  var m = typeof marcaAtual === "function" ? marcaAtual() : {};
  $("#pcFichaPrint").innerHTML =
    (m.nome || m.logo ? '<div class="marca">' + (m.logo ? '<img src="' + m.logo + '" alt="">' : "") +
      "<span>" + esc(m.nome || "") + "</span></div>" : "") +
    "<h1>" + esc(d.nome) + "</h1><div>Ficha técnica · rende " + fmtQtd(d.rend, 0) + " marmitas · " +
    esc(new Date().toLocaleDateString("pt-BR")) + "</div>" +
    '<table><thead><tr><th>Ingrediente</th><th class="n">Por marmita</th><th class="n">Receita inteira</th></tr></thead><tbody>' +
    d.linhas.map(function (l) {
      return "<tr><td>" + esc(l.nome) + '</td><td class="n">' + esc(l.porMarmita) + '</td><td class="n">' + esc(l.lote) + "</td></tr>";
    }).join("") + "</tbody></table>" +
    '<div class="resumo">Custo por marmita: <strong>' + formatBRL(d.c.custoTotal) + "</strong></div>" +
    '<div class="resumo">Preço de venda: <strong>' + formatBRL(d.c.precoArredondado) + "</strong></div>";
  document.body.classList.add("imprimindo");
  var limpar = function () { document.body.classList.remove("imprimindo"); window.removeEventListener("afterprint", limpar); };
  window.addEventListener("afterprint", limpar);
  window.print(); // a classe só afeta a impressão; sai no afterprint
}

/* ---------------- início ---------------- */
function renderStep() {
  if (st.tela && st.tela !== "calc" && typeof renderFerramenta === "function") { renderFerramenta(); return; }
  if (st.step === 1) renderStep1();
  else if (st.step === 2) renderStep2();
  else renderStep3();
}

$("#pcBadge").innerHTML = icone("calculator", 20);
renderTabs();
renderStep();
</script>

<script>
/* ---------------- tutorial em vídeo ----------------
   Só abre e fecha um modal por cima da calculadora. Não toca no estado (st),
   nos cálculos nem nas chaves de localStorage da calculadora.                */
(function () {
  "use strict";
  var DESTAQUE_KEY = "preco_certo_tutorial_destaque_v1";
  var botao = document.getElementById("pcTutorialBtn");
  var modal = document.getElementById("pcTutorial");
  var video = document.getElementById("pcTutorialVideo");
  var moldura = document.getElementById("pcTutorialMoldura");
  var btnFechar = document.getElementById("pcTutorialFechar");
  var fundo = modal.querySelector(".pc-modal-fundo");
  var bloqueados = [document.querySelector(".pc-shell"), document.querySelector(".pc-footer-note")];
  var focoAnterior = null;

  // brilho de destaque só na primeira visita
  var jaDestacou = false;
  try { jaDestacou = localStorage.getItem(DESTAQUE_KEY) === "1"; } catch (e) {}
  if (!jaDestacou) {
    botao.classList.add("destaque");
    botao.addEventListener("animationend", function () { botao.classList.remove("destaque"); });
    try { localStorage.setItem(DESTAQUE_KEY, "1"); } catch (e) {}
  }

  function focaveis() {
    return Array.prototype.filter.call(modal.querySelectorAll("button, video[controls]"), function (el) {
      return !el.disabled && el.offsetParent !== null;
    });
  }

  function abrir() {
    focoAnterior = document.activeElement;
    // a capa só é baixada quando o tutorial é aberto pela primeira vez
    if (!video.getAttribute("poster") && video.dataset.capa) video.setAttribute("poster", video.dataset.capa);
    modal.hidden = false;
    modal.classList.add("abrindo");
    document.documentElement.style.overflow = "hidden";
    bloqueados.forEach(function (el) {
      if (!el) return;
      el.setAttribute("inert", "");
      el.setAttribute("aria-hidden", "true");
    });
    botao.setAttribute("aria-expanded", "true");
    btnFechar.focus();
  }

  function fechar() {
    if (modal.hidden) return;
    if (!video.paused) video.pause();
    modal.hidden = true;
    modal.classList.remove("abrindo");
    document.documentElement.style.overflow = "";
    bloqueados.forEach(function (el) {
      if (!el) return;
      el.removeAttribute("inert");
      el.removeAttribute("aria-hidden");
    });
    botao.setAttribute("aria-expanded", "false");
    (focoAnterior && document.contains(focoAnterior) ? focoAnterior : botao).focus();
  }

  botao.addEventListener("click", abrir);
  btnFechar.addEventListener("click", fechar);
  fundo.addEventListener("click", fechar);

  document.addEventListener("keydown", function (e) {
    if (modal.hidden) return;
    if (e.key === "Escape" || e.key === "Esc") {
      // em tela cheia, o Esc pertence ao navegador (sai da tela cheia)
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      e.preventDefault();
      fechar();
      return;
    }
    if (e.key === "Tab") {
      // mantém o foco dentro do modal
      var lista = focaveis();
      if (!lista.length) return;
      var primeiro = lista[0];
      var ultimo = lista[lista.length - 1];
      if (e.shiftKey && (document.activeElement === primeiro || !modal.contains(document.activeElement))) {
        e.preventDefault();
        ultimo.focus();
      } else if (!e.shiftKey && (document.activeElement === ultimo || !modal.contains(document.activeElement))) {
        e.preventDefault();
        primeiro.focus();
      }
    }
  });

  // depois de um clique/toque nos controles nativos o navegador prende o teclado dentro do
  // player e o Esc não chega à página; devolve o foco à caixa do modal para o Esc continuar fechando
  var caixa = document.getElementById("pcTutorialCaixa");
  video.addEventListener("pointerup", function () {
    setTimeout(function () { caixa.focus({ preventScroll: true }); }, 0);
  });

  // V2: se nenhuma fonte tocar, mostra o link para abrir o vídeo fora do player
  var fontes = video.querySelectorAll("source");
  var ultimaFonte = fontes[fontes.length - 1];
  if (ultimaFonte) ultimaFonte.addEventListener("error", function () {
    video.hidden = true;
    document.getElementById("pcTutorialErro").hidden = false;
  });

  // ajusta a moldura à proporção real do vídeo (16:9, vertical…) quando ele carrega
  video.addEventListener("loadedmetadata", function () {
    if (video.videoWidth && video.videoHeight) {
      moldura.style.setProperty("--pc-video-proporcao", (video.videoWidth / video.videoHeight).toFixed(4));
    }
  });
})();
</script>

<script>
/* =====================================================================
   V2 — FERRAMENTAS: meta de lucro, bebidas, maquininha, entrega, marca.
   Usa as funções globais da calculadora (st, calcular, toNum, formatBRL, esc...).
   Valores de referência (editáveis, com fonte e data):
   - InfinitePay, faturamento até R$ 20 mil/mês: débito 1,37%, crédito à vista 3,15%, Pix 0%
     (infinitepay.io/taxas, consultado em 18/11/2026).
   - Vale-refeição/alimentação: taxa máxima (MDR) de 3,6% — Decreto 12.712/2025, em vigor desde 10/02/2026.
   - Gasolina comum: R$ 6,47/L — média ANP, semana de 1 a 7/11/2026.
   - Motoboy terceirizado: R$ 1,50 a R$ 2,30 por km, saída mínima perto de R$ 8,00 (referência de mercado 2026).
   - Bebidas: custo do produto entre 25% e 35% do preço de venda (referência de CMV usada pelo Sebrae).
   ===================================================================== */
"use strict";

var MARCA_KEY = "preco_certo_marca_v1";
var MAQ_KEY = "preco_certo_maquininha_v1";
var ENTREGA_KEY = "preco_certo_entrega_v2"; // v2: bases novas, não herda as antigas
var BEBIDAS_KEY = "preco_certo_bebidas_v1";
var META_KEY = "preco_certo_meta_v1";

var TELAS = [
  { id: "calc", label: "Calculadora" },
  { id: "meta", label: "Meta de lucro" },
  { id: "bebidas", label: "Bebidas" },
  { id: "maquininha", label: "Maquininha" },
  { id: "entrega", label: "Entrega" },
  { id: "marca", label: "Meu restaurante" }
];

var MAQ_REF = { pix: "0", debito: "1,37", credito: "3,15", vr: "3,6" };
var MAQ_PADRAO = Object.assign({}, MAQ_REF, { mixPix: "50", mixDeb: "20", mixCred: "20", mixVr: "10", baseId: "", base: "" });
// Bases calibradas para entrega de bairro: 3 km ficam entre R$ 5 e R$ 10, taxa típica até R$ 8.
var ENTREGA_PADRAO = {
  modo: "fixa", taxaFixa: "6,00",
  consumo: "35", gasolina: "6,47", desgaste: "0,20", velocidade: "25", parado: "5",
  valorHora: "12", idaVolta: true, extra: "0", fixo: "5,00", porKm: "1,00", distancia: "3", marmitasPedido: "1",
  // aplicativo de entrega sob demanda: valores-base, a pessoa troca pelo que o app cobra na cidade dela
  appBase: "6,00", appKm: "1,00", appKmIncl: "2", appPico: "0"
};

st.tela = "calc";
st.maq = Object.assign({}, MAQ_PADRAO, lerJSON(MAQ_KEY, {}));
st.entrega = Object.assign({}, ENTREGA_PADRAO, lerJSON(ENTREGA_KEY, {}));
st.bebidas = lerJSON(BEBIDAS_KEY, []);
st.bebidaForm = null;
st.meta = Object.assign({ marmitaId: "", lucro: "", preco: "", taxa: "" }, lerJSON(META_KEY, {}));
st.marca = Object.assign({ nome: "", logo: "" }, lerJSON(MARCA_KEY, {}));

/* ---------------- utilidades das ferramentas ---------------- */
function arredCima(v, passo) {
  passo = passo || 0.5;
  return Math.ceil((v - 1e-9) / passo) * passo;
}
function pct(v) { return toNum(v) / 100; }
function fmtNum(n, casas) { return n.toLocaleString("pt-BR", { maximumFractionDigits: casas || 0 }); }

function campo(o) {
  var wrap = o.prefixo || o.sufixo;
  return '<div class="pc-field"' + (o.estilo ? ' style="' + o.estilo + '"' : "") + '><label class="pc-label" for="' + o.id + '">' + o.label + "</label>" +
    (wrap ? '<div class="pc-input-wrap">' : "") +
    (o.prefixo ? '<span class="pc-prefix">' + o.prefixo + "</span>" : "") +
    '<input class="pc-input' + (o.prefixo ? " has-prefix" : "") + (o.modo === "text" ? " text" : "") + '" id="' + o.id +
    '" inputmode="' + (o.modo === "text" ? "text" : (o.modo || "decimal")) + '"' +
    (o.ph ? ' placeholder="' + esc(o.ph) + '"' : "") + ' value="' + esc(o.valor == null ? "" : o.valor) + '">' +
    (o.sufixo ? '<span class="pc-suffix">' + o.sufixo + "</span>" : "") +
    (wrap ? "</div>" : "") +
    (o.help ? '<p class="pc-help">' + o.help + "</p>" : "") + "</div>";
}

// liga inputs a um objeto de estado; grava e recalcula sem redesenhar (o foco não se perde)
function ligar(obj, pares, chave, depois) {
  pares.forEach(function (p) {
    var el = document.getElementById(p[0]);
    if (!el) return;
    el.addEventListener("input", function () {
      obj[p[1]] = el.value;
      if (chave) escreverJSON(chave, obj);
      depois();
    });
  });
}

function marmitasComPreco() {
  return st.salvos.filter(function (s) { return s.precoArredondado != null && s.custoTotal != null; });
}

function opcoesMarmitas(selId, comVazio) {
  return (comVazio ? '<option value="">' + comVazio + "</option>" : "") +
    marmitasComPreco().map(function (s) {
      return '<option value="' + s.id + '"' + (String(s.id) === String(selId) ? " selected" : "") + ">" +
        esc(s.nome) + " — " + formatBRL(s.precoArredondado) + "</option>";
    }).join("");
}

function taxaMediaMaq(m) {
  m = m || st.maq;
  var pares = [[m.mixPix, m.pix], [m.mixDeb, m.debito], [m.mixCred, m.credito], [m.mixVr, m.vr]];
  var soma = 0, pond = 0;
  pares.forEach(function (p) { soma += toNum(p[0]); pond += toNum(p[0]) * pct(p[1]); });
  return soma > 0 ? pond / soma : 0;
}

/* ---------------- navegação ---------------- */
function renderNav() {
  var nav = $("#pcNav");
  if (!nav) return;
  var atual = st.tela || "calc";
  nav.innerHTML = TELAS.map(function (t) {
    return '<button type="button" class="pc-chip' + (t.id === atual ? " active" : "") + '" data-tela="' + t.id + '"' +
      (t.id === atual ? ' aria-current="page"' : "") + ">" + t.label + "</button>";
  }).join("");
  Array.prototype.forEach.call(nav.children, function (b) {
    b.addEventListener("click", function () { abrirTela(b.dataset.tela); });
  });
}

function abrirTela(id) {
  if (id === "calc") { irPara(st.step || 1); return; }
  irPara(st.step || 1); // devolve ingrediente em correção, se houver
  st.tela = id;
  renderTabs();
  renderStep();
  window.scrollTo(0, 0);
}

function renderFerramenta() {
  ({ meta: renderMeta, bebidas: renderBebidas, maquininha: renderMaquininha, entrega: renderEntrega, marca: renderMarca }[st.tela] || renderMeta)();
}

/* =====================================================================
   1) META DE LUCRO
   lucro do mês = vendas × (preço × (1 − impostos − taxa da maquininha) − custo variável) − despesa fixa
   custo variável = custo da marmita sem a despesa fixa rateada (ingredientes + embalagem + sua hora)
   ===================================================================== */
function renderMeta() {
  var lista = marmitasComPreco();
  // acompanha a tela Maquininha até a pessoa digitar a própria taxa aqui
  if (!st.meta.taxaManual) st.meta.taxa = fmtNum(taxaMediaMaq() * 100, 2);
  if (!lista.length) {
    $("#pcBody").innerHTML = '<h2 class="pc-step-title">Meta de lucro</h2>' +
      '<p class="pc-step-sub">Descubra quantas marmitas você precisa vender no mês para chegar no lucro que quer.</p>' +
      '<div class="pc-aviso">Primeiro guarde pelo menos uma marmita na calculadora. A meta usa o custo e o preço dela.</div>' +
      '<div class="pc-btn-row"><button type="button" class="pc-btn pc-btn-primary" id="irCalc">Ir para a calculadora</button></div>';
    $("#irCalc").addEventListener("click", function () { abrirTela("calc"); });
    return;
  }
  if (!lista.some(function (s) { return String(s.id) === String(st.meta.marmitaId); })) st.meta.marmitaId = String(lista[0].id);

  $("#pcBody").innerHTML =
    '<h2 class="pc-step-title">Meta de lucro</h2>' +
    '<p class="pc-step-sub">Quantas marmitas você precisa vender no mês para sobrar o lucro que você quer.</p>' +
    '<div class="pc-field"><label class="pc-label" for="m-marmita">Qual marmita?</label>' +
    '<select class="pc-input text" id="m-marmita">' + opcoesMarmitas(st.meta.marmitaId) + "</select></div>" +
    campo({ id: "m-lucro", label: "Quanto você quer de lucro no mês?", prefixo: "R$", ph: "ex: 3.000", valor: st.meta.lucro,
      help: "Lucro de verdade: o que sobra depois de pagar as despesas fixas, os ingredientes, a embalagem e a sua hora de trabalho." }) +
    '<div class="pc-row2">' +
      campo({ id: "m-preco", label: "Preço de venda", prefixo: "R$", ph: "", valor: st.meta.preco,
        help: "Vazio = o preço guardado na marmita." }) +
      campo({ id: "m-taxa", label: "Taxa média da maquininha", sufixo: "%", valor: st.meta.taxa,
        help: "Vem da tela Maquininha. Use 0 se só recebe em dinheiro." }) +
    "</div>" +
    '<div id="m-res"></div>';

  $("#m-marmita").addEventListener("change", function () {
    st.meta.marmitaId = this.value; st.meta.preco = ""; $("#m-preco").value = "";
    escreverJSON(META_KEY, st.meta); atualizarMeta();
  });
  $("#m-taxa").addEventListener("input", function () { st.meta.taxaManual = true; });
  ligar(st.meta, [["m-lucro", "lucro"], ["m-preco", "preco"], ["m-taxa", "taxa"]], META_KEY, atualizarMeta);
  atualizarMeta();
}

function contribuicaoDe(s, preco, taxa) {
  var c = calcular();
  var fixoNaMarmita = s.custoFixoRateado != null ? s.custoFixoRateado : (c.despesaFixaRateada || 0);
  var custoVar = s.custoTotal - fixoNaMarmita;
  return { custoVar: custoVar, aproximado: s.custoFixoRateado == null,
           contrib: preco * (1 - c.impostosFrac - taxa) - custoVar };
}

function vendasParaMeta(s, preco, taxa, lucro, despesa) {
  var k = contribuicaoDe(s, preco, taxa);
  return k.contrib > 0 ? Math.ceil((lucro + despesa) / k.contrib) : null;
}

function atualizarMeta() {
  var area = $("#m-res");
  if (!area) return;
  var s = st.salvos.find(function (x) { return String(x.id) === String(st.meta.marmitaId); });
  if (!s) { area.innerHTML = ""; return; }
  var preco = st.meta.preco !== "" ? toNum(st.meta.preco) : s.precoArredondado;
  $("#m-preco").placeholder = formatBRL(s.precoArredondado).replace("R$", "").trim();
  var taxa = pct(st.meta.taxa);
  var lucro = toNum(st.meta.lucro);
  var despesa = toNum(st.negocio.despesaFixa);
  var dias = toNum(st.negocio.dias);
  var capacidade = dias * toNum(st.negocio.marmitasDia);
  var k = contribuicaoDe(s, preco, taxa);

  if (k.contrib <= 0) {
    area.innerHTML = '<div class="pc-aviso ruim">Com ' + formatBRL(preco) + ", cada " + esc(s.nome) +
      " não sobra nada depois de pagar o custo dela (" + formatBRL(k.custoVar) + " sem a despesa fixa), os impostos e a maquininha. " +
      "Nenhuma quantidade de vendas chega no lucro. Suba o preço ou reduza o custo.</div>";
    return;
  }

  var n = Math.ceil((lucro + despesa) / k.contrib);
  var equilibrio = Math.ceil(despesa / k.contrib);
  var porDia = dias > 0 ? Math.ceil(n / dias) : null;
  var faturamento = n * preco;

  var html = '<div class="pc-res"><div class="eyebrow">' + (lucro > 0 ? "para lucrar " + formatBRL(lucro) + " no mês" : "para pagar as contas do mês") + "</div>" +
    '<div class="grande">' + fmtNum(lucro > 0 ? n : equilibrio) + " marmitas</div>" +
    '<div class="det">' + (porDia ? "≈ <strong>" + fmtNum(Math.ceil((lucro > 0 ? n : equilibrio) / dias)) + " por dia</strong> em " + fmtNum(dias) + " dias de trabalho · " : "") +
    "faturamento de <strong>" + formatBRL((lucro > 0 ? n : equilibrio) * preco) + "</strong></div></div>";

  html += '<table class="pc-tabela"><tbody>' +
    "<tr><td>Cada marmita deixa (já pagos ingredientes, embalagem, sua hora, impostos e taxa)</td><td class=\"n\"><strong>" + formatBRL(k.contrib) + "</strong></td></tr>" +
    "<tr><td>Despesa fixa do mês</td><td class=\"n\">" + formatBRL(despesa) + "</td></tr>" +
    "<tr><td>Só para pagar a despesa fixa (lucro zero)</td><td class=\"n\">" + fmtNum(equilibrio) + " marmitas</td></tr>" +
    (lucro > 0 ? "<tr><td>Para a sua meta</td><td class=\"n\"><strong>" + fmtNum(n) + " marmitas</strong></td></tr>" : "") +
    "</tbody></table>";

  if (lucro > 0 && capacidade > 0) {
    html += n > capacidade
      ? '<div class="pc-aviso ruim">Você precisaria de ' + fmtNum(n) + " marmitas, mas hoje produz cerca de " + fmtNum(capacidade) +
        " por mês (" + fmtNum(toNum(st.negocio.marmitasDia)) + " por dia). Para chegar lá: subir o preço, baixar o custo ou produzir mais.</div>"
      : '<div class="pc-aviso bom">Cabe na sua produção: ' + fmtNum(n) + " de " + fmtNum(capacidade) + " marmitas que você consegue fazer no mês (" +
        fmtNum(n / capacidade * 100) + "% da capacidade).</div>";
  }

  if (lucro > 0) {
    html += '<div class="pc-section-label">E se o preço fosse outro?</div><table class="pc-tabela"><thead><tr><th>Preço</th><th class="n">Marmitas/mês</th><th class="n">Por dia</th></tr></thead><tbody>' +
      [-1, 0, 1, 2, 3].map(function (d) {
        var p = preco + d;
        if (p <= 0) return "";
        var q = vendasParaMeta(s, p, taxa, lucro, despesa);
        return '<tr class="' + (d === 0 ? "destaque" : "") + '"><td>' + formatBRL(p) + '</td><td class="n">' + (q ? fmtNum(q) : "não fecha") +
          '</td><td class="n">' + (q && dias > 0 ? fmtNum(Math.ceil(q / dias)) : "—") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  html += '<div class="pc-ref">' +
    (k.aproximado ? "<strong>Atenção:</strong> esta marmita foi guardada numa versão anterior; a parte da despesa fixa foi estimada com os números de hoje. Guarde de novo para ficar exato.<br>" : "") +
    "Conta usada: cada venda deixa preço − impostos − taxa da maquininha − custo da marmita sem a despesa fixa. " +
    "As vendas precisam cobrir a despesa fixa do mês e depois formar o lucro. A sua hora de trabalho já está paga dentro do custo.</div>";
  area.innerHTML = html;
}

/* =====================================================================
   2) BEBIDAS
   preço sugerido = custo por unidade ÷ (% de custo desejado)
   preço mínimo   = custo por unidade ÷ (1 − impostos − taxa da maquininha)
   ===================================================================== */
var BEBIDA_PRESETS = [
  { nome: "Refrigerante lata 350 ml", tipo: "revenda", unidades: "12", extra: "0" },
  { nome: "Refrigerante 2 L", tipo: "revenda", unidades: "6", extra: "0" },
  { nome: "Água mineral 500 ml", tipo: "revenda", unidades: "12", extra: "0" },
  { nome: "Suco natural 300 ml", tipo: "preparada", rendimento: "10", extra: "0,60" }
];

function bebidaVazia() {
  return { id: null, nome: "", tipo: "revenda", pacote: "", unidades: "", lote: "", rendimento: "", extra: "", cmv: "35" };
}

function calcBebida(b) {
  var base = b.tipo === "revenda"
    ? (toNum(b.unidades) > 0 ? toNum(b.pacote) / toNum(b.unidades) : null)
    : (toNum(b.rendimento) > 0 ? toNum(b.lote) / toNum(b.rendimento) : null);
  if (base === null || base <= 0) return null;
  var custo = base + toNum(b.extra);
  var cmv = pct(b.cmv);
  var c = calcular();
  var taxa = taxaMediaMaq();
  var sugeridoExato = cmv > 0 ? custo / cmv : null;
  var sugerido = sugeridoExato !== null ? arredCima(sugeridoExato) : null;
  var minimo = 1 - c.impostosFrac - taxa > 0 ? custo / (1 - c.impostosFrac - taxa) : null;
  var sobra = sugerido !== null ? sugerido * (1 - c.impostosFrac - taxa) - custo : null;
  return { custo: custo, sugerido: sugerido, sugeridoExato: sugeridoExato, minimo: minimo, sobra: sobra, mult: sugerido / custo, taxa: taxa };
}

/* =====================================================================
   4) ENTREGA
   entrega própria: combustível (km rodados ÷ consumo × gasolina) + desgaste por km + tempo do entregador + extras
   motoboy: saída fixa + valor por km
   ===================================================================== */
function custoEntrega(km, e) {
  e = e || st.entrega;
  if (e.modo === "fixa") return toNum(e.taxaFixa);
  if (e.modo === "motoboy") return toNum(e.fixo) + km * toNum(e.porKm) + toNum(e.extra);
  if (e.modo === "app") {
    // tarifa base (com alguns km já incluídos) + km adicional, mais o acréscimo de horário de pico
    var corrida = toNum(e.appBase) + Math.max(0, km - toNum(e.appKmIncl)) * toNum(e.appKm);
    return corrida * (1 + pct(e.appPico)) + toNum(e.extra);
  }
  var rodado = km * (e.idaVolta ? 2 : 1);
  var combustivel = toNum(e.consumo) > 0 ? rodado / toNum(e.consumo) * toNum(e.gasolina) : 0;
  var desgaste = rodado * toNum(e.desgaste);
  var minutos = (toNum(e.velocidade) > 0 ? rodado / toNum(e.velocidade) * 60 : 0) + toNum(e.parado);
  var tempo = minutos / 60 * toNum(e.valorHora);
  return combustivel + desgaste + tempo + toNum(e.extra);
}

function renderEntrega() {

  ligar(e, [["e-gas", "gasolina"], ["e-cons", "consumo"], ["e-desg", "desgaste"], ["e-vel", "velocidade"], ["e-par", "parado"], ["e-hora", "valorHora"],
    ["e-fixo", "fixo"], ["e-km", "porKm"], ["e-extra", "extra"],
    ["e-tfixa", "taxaFixa"], ["e-abase", "appBase"], ["e-aincl", "appKmIncl"], ["e-akm", "appKm"], ["e-apico", "appPico"], ["e-dist", "distancia"], ["e-mp", "marmitasPedido"]], ENTREGA_KEY, atualizarEntrega);
