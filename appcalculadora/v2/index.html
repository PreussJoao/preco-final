function atualizarEntrega() {
  var area = $("#e-res");
  if (!area) return;
  var e = st.entrega;
  var faixas = [1, 2, 3, 4, 5, 6, 8, 10];
  var dist = toNum(e.distancia);
  if (e.modo === "fixa") {
    // compara a taxa fixa com o custo de entregar de moto (parâmetros da aba "Eu entrego")
    var fixa = toNum(e.taxaFixa);
    var propriaE = Object.assign({}, e, { modo: "propria" });
    var limite = null;
    for (var km = 0.5; km <= 15; km += 0.5) { if (custoEntrega(km, propriaE) > fixa) { limite = km - 0.5; break; } }
    area.innerHTML = '<div class="pc-section-label">Até onde ' + formatBRL(fixa) + " cobre</div>" +
      '<table class="pc-tabela"><thead><tr><th>Até</th><th class="n">Custo de entregar</th><th class="n">Sobra</th></tr></thead><tbody>' +
      faixas.map(function (k) {
        var c = custoEntrega(k, propriaE);
        var sobra = fixa - c;
        return '<tr class="' + (sobra < 0 ? "" : "") + '"><td>' + k + ' km</td><td class="n">' + formatBRL(c) +
          '</td><td class="n" style="color:' + (sobra < 0 ? "var(--danger)" : "var(--accent)") + '"><strong>' + formatBRL(sobra) + "</strong></td></tr>";
      }).join("") + "</tbody></table>" +
      (limite !== null
        ? '<div class="pc-aviso">Com ' + formatBRL(fixa) + " de taxa fixa, a entrega se paga até cerca de <strong>" + fmtNum(limite, 1) +
          " km</strong>. Mais longe que isso, você paga para entregar: defina um raio máximo ou cobre um adicional.</div>"
        : '<div class="pc-aviso bom">' + formatBRL(fixa) + " cobre o custo de entregar em toda a faixa de até 15 km.</div>") +
      '<p class="pc-help">Custo de entregar de moto, com ida e volta, gasolina, desgaste e a hora de quem entrega (ajuste na aba “Eu entrego”).</p>';
  } else
  area.innerHTML = '<div class="pc-section-label">Sua tabela de entrega</div>' +
    '<table class="pc-tabela"><thead><tr><th>Até</th><th class="n">Custo real</th><th class="n">Cobrar</th></tr></thead><tbody>' +
    faixas.map(function (km) {
      var c = custoEntrega(km);
      var marca = dist > 0 && km === faixas.find(function (f) { return f >= dist; });
      return '<tr class="' + (marca ? "destaque" : "") + '"><td>' + km + ' km</td><td class="n">' + formatBRL(c) + '</td><td class="n"><strong>' + formatBRL(arredCima(c)) + "</strong></td></tr>";
    }).join("") + "</tbody></table>" +
    '<p class="pc-help">Arredondado para cima, de R$ 0,50 em R$ 0,50. Pela distância em linha até o cliente' + (e.modo !== "motoboy" && e.modo !== "app" && e.idaVolta ? "; o custo já conta a volta" : "") + ".</p>";

  var g = $("#e-gratis");
  var mp = Math.max(1, toNum(e.marmitasPedido, 1));
  if (dist > 0) {
    var c = custoEntrega(dist);
    g.innerHTML = '<div class="pc-aviso">Para entregar grátis até ' + fmtNum(dist, 1) + " km sem perder dinheiro, embuta <strong>" +
      formatBRL(arredCima(c / mp, 0.25)) + "</strong> em cada marmita" + (mp > 1 ? " (pedido médio de " + fmtNum(mp) + " marmitas)" : "") +
      ". Custo real da entrega: " + formatBRL(c) + ".</div>";
  } else g.innerHTML = "";
}

/* =====================================================================
   5) MEU RESTAURANTE (nome e logo) — fica só neste aparelho
   ===================================================================== */
function marcaAtual() { return st.marca || {}; }

function aplicarMarca() {
  var m = marcaAtual();
  var badge = $("#pcBadge");
  if (m.logo) { badge.innerHTML = '<img src="' + m.logo + '" alt="">'; badge.classList.add("com-logo"); }
  else { badge.innerHTML = icone("calculator", 20); badge.classList.remove("com-logo"); }
  var h1 = document.querySelector(".pc-header-text h1");
  var sub = document.querySelector(".pc-header-text p");
  h1.textContent = m.nome ? m.nome : "Preço Certo";
  sub.textContent = m.nome ? "calculadora Preço Certo" : "descubra quanto cobrar pela sua marmita";
}

function renderMarca() {
  var m = st.marca;
  $("#pcBody").innerHTML =
    '<h2 class="pc-step-title">Meu restaurante</h2>' +
    '<p class="pc-step-sub">Seu nome e seu logo no topo da calculadora e na ficha técnica que você imprime ou manda no WhatsApp.</p>' +
    '<div class="pc-logo-prev"><div class="badge" id="r-prev-badge">' + (m.logo ? '<img src="' + m.logo + '" alt="">' : icone("calculator", 24)) + "</div>" +
    '<div><div class="nm" id="r-prev-nome">' + esc(m.nome || "Nome do seu restaurante") + '</div><div class="sb">calculadora Preço Certo</div></div></div>' +
    campo({ id: "r-nome", label: "Nome do restaurante", modo: "text", ph: "ex: Marmitaria do Zé", valor: m.nome }) +
    '<div class="pc-field"><label class="pc-label" for="r-logo">Logo</label>' +
    '<input class="pc-file" type="file" id="r-logo" accept="image/*">' +
    '<p class="pc-help">Imagem quadrada fica melhor. Ela é reduzida e guardada só neste aparelho.</p></div>' +
    (m.logo ? '<button type="button" class="pc-link-btn" id="r-tirar">Tirar o logo</button>' : "");

  $("#r-nome").addEventListener("input", function () {
    m.nome = this.value.slice(0, 60);
    escreverJSON(MARCA_KEY, m);
    $("#r-prev-nome").textContent = m.nome || "Nome do seu restaurante";
    aplicarMarca();
  });
  $("#r-logo").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast("Escolha um arquivo de imagem."); return; }
    reduzirImagem(f, 256, function (dataUrl) {
      if (!dataUrl) { toast("Não consegui abrir essa imagem. Tente outra."); return; }
      m.logo = dataUrl;
      if (!escreverJSON(MARCA_KEY, m)) { m.logo = ""; toast("Não deu para guardar o logo neste navegador."); return; }
      aplicarMarca();
      renderMarca();
      toast("Logo guardado.");
    });
  });
  if ($("#r-tirar")) $("#r-tirar").addEventListener("click", function () {
    m.logo = ""; escreverJSON(MARCA_KEY, m); aplicarMarca(); renderMarca();
  });
}

// recorta no centro em quadrado e reduz para caber no armazenamento do navegador
function reduzirImagem(arquivo, lado, pronto) {
  var leitor = new FileReader();
  leitor.onerror = function () { pronto(null); };
  leitor.onload = function () {
    var img = new Image();
    img.onerror = function () { pronto(null); };
    img.onload = function () {
      var menor = Math.min(img.width, img.height);
      var cv = document.createElement("canvas");
      cv.width = lado; cv.height = lado;
      var ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, lado, lado);
      ctx.drawImage(img, (img.width - menor) / 2, (img.height - menor) / 2, menor, menor, 0, 0, lado, lado);
      pronto(cv.toDataURL("image/jpeg", 0.86));
    };
    img.src = leitor.result;
  };
  leitor.readAsDataURL(arquivo);
}

aplicarMarca();
renderNav();
